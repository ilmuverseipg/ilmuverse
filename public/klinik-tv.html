<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klinik Kata Majmuk — Skrin TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600;700&display=swap">
<style>
  :root { --teal: #0f766e; --teal2: #14a394; --dakwat: #13334c; --kabur: #5b7285; --merah: #e8434f; --latar: #eaf7f3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Fredoka', system-ui, sans-serif; color: var(--dakwat); background: #03080f; }
  [hidden] { display: none !important; }
  iframe.sis { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #03080f; }
  iframe.sis.on { display: block; }

  /* ===== skrin utama ===== */
  #utama { position: fixed; inset: 0; overflow: auto; padding: 3.2vh 3vw; color: var(--dakwat);
    background: radial-gradient(circle at 10% 0%, #fff 0, transparent 40%), radial-gradient(circle at 100% 100%, #d7efe8 0, transparent 45%), var(--latar); }
  .tajuk { display: flex; align-items: center; gap: 1.6vw; }
  .salib { width: 9vh; height: 9vh; flex: none; border-radius: 2.4vh; background: #fff; box-shadow: 0 1vh 3vh rgba(19,51,76,.12); display: grid; place-items: center; }
  .salib i { position: relative; width: 5.4vh; height: 5.4vh; }
  .salib i::before, .salib i::after { content: ''; position: absolute; background: var(--merah); border-radius: .6vh; }
  .salib i::before { left: 1.9vh; top: 0; width: 1.6vh; height: 5.4vh; } .salib i::after { top: 1.9vh; left: 0; width: 5.4vh; height: 1.6vh; }
  .tajuk small { display: block; letter-spacing: .4vh; font-weight: 600; color: var(--teal); font-size: 2vh; }
  .tajuk h1 { margin: 0; font-family: 'Baloo 2'; font-weight: 800; font-size: 7vh; line-height: 1; }
  .tajuk p { margin: .6vh 0 0; color: var(--kabur); font-size: 2.3vh; }
  .badan { display: grid; grid-template-columns: 1.5fr 1fr; gap: 3vw; margin-top: 3.4vh; align-items: start; }
  .langkahL { display: grid; gap: 1.4vh; }
  .lk { display: flex; align-items: center; gap: 1.4vw; background: #fff; border-radius: 2.2vh; padding: 1.6vh 1.6vw; box-shadow: 0 1vh 2.6vh rgba(19,51,76,.09); border: 2px solid transparent; cursor: pointer; transition: transform .15s, border-color .15s; }
  .lk:hover { transform: translateY(-2px); border-color: var(--teal2); }
  .lk .ik { width: 7vh; height: 7vh; border-radius: 1.8vh; display: grid; place-items: center; font-size: 4vh; flex: none; background: color-mix(in srgb, var(--w) 16%, #fff); }
  .lk .tg { font-family: 'Baloo 2'; font-weight: 800; font-size: 3.2vh; line-height: 1.05; }
  .lk .tg small { display: block; font-family: 'Fredoka'; font-weight: 600; font-size: 1.8vh; color: var(--w); letter-spacing: .15vh; }
  .lk .ds { color: var(--kabur); font-size: 1.9vh; margin-top: .3vh; }
  .qrK { background: #fff; border-radius: 3vh; padding: 3vh 2vw; text-align: center; box-shadow: 0 1.4vh 4vh rgba(19,51,76,.12); }
  .qrK h2 { margin: 0 0 .6vh; font-family: 'Baloo 2'; font-weight: 800; font-size: 4vh; }
  .qrK p { margin: 0 0 1.8vh; color: var(--kabur); font-size: 2.1vh; }
  #qr { display: inline-block; line-height: 0; padding: 1.2vh; border-radius: 2vh; border: 3px solid #e3efeb; }
  #qr svg { width: 34vh; height: 34vh; }
  .kod { font-family: 'Baloo 2'; font-weight: 800; font-size: 6vh; letter-spacing: 1.2vh; color: var(--teal); margin-top: 1vh; }
  .sambungOk { display: inline-flex; align-items: center; gap: .8vw; margin-top: 1.4vh; padding: 1vh 1.6vw; border-radius: 99px; background: #e6f7f3; color: var(--teal); font-weight: 700; font-size: 2.2vh; }
  .sambungOk i { width: 1.4vh; height: 1.4vh; border-radius: 50%; background: #9ca3af; }
  .sambungOk.ok i { background: #16a34a; box-shadow: 0 0 0 .5vh rgba(22,163,74,.2); }

  /* ===== jalur kecil (bila sistem dipaparkan) ===== */
  #jalur { position: fixed; left: 1vw; bottom: 1.4vh; z-index: 50; display: flex; align-items: center; gap: .6vw; padding: .6vh .6vw .6vh 1vw; border-radius: 99px;
    background: rgba(8,20,34,.82); color: #fff; font-weight: 700; font-size: 1.7vh; backdrop-filter: blur(6px); transition: opacity .4s; }
  body.idle #jalur { opacity: 0; }
  #jalur .d { width: 1.1vh; height: 1.1vh; border-radius: 50%; background: #ffb020; } #jalur .d.ok { background: #4ade80; }
  #jalur button { font: inherit; color: #fff; background: rgba(255,255,255,.12); border: 0; border-radius: 99px; padding: .6vh 1vw; cursor: pointer; }
  #jalur button:hover { background: rgba(255,255,255,.24); }

  /* ===== buka bunyi ===== */
  #mula { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(3,20,26,.6); backdrop-filter: blur(4px); }
  #mula button { font-family: 'Baloo 2'; font-weight: 800; font-size: 4.4vh; color: #fff; background: linear-gradient(135deg, var(--teal2), var(--teal)); border: .5vh solid #fff; border-radius: 99px; padding: 2.2vh 4vw; cursor: pointer; box-shadow: 0 2vh 6vh rgba(0,0,0,.35); animation: denyut 1.6s ease-in-out infinite; }
  #mula p { color: #fff; text-align: center; font-size: 2.2vh; margin: 2vh 0 0; font-weight: 600; }
  @keyframes denyut { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  /* ===== tajuk sistem (3 saat) ===== */
  #lTajuk { position: fixed; inset: 0; z-index: 57; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, var(--wt, #0d9488) 0%, #04121c 72%); color: #fff; text-align: center; transition: opacity .45s; }
  #lTajuk.keluar { opacity: 0; }
  #lTajuk .tk { animation: masukT .6s cubic-bezier(.2,1.4,.4,1) both; }
  #lTajuk .ik { font-size: 16vh; line-height: 1; filter: drop-shadow(0 1.5vh 3vh rgba(0,0,0,.45)); animation: lompatT 1s .2s ease-in-out infinite alternate; }
  #lTajuk .jen { margin-top: 2.4vh; font-weight: 800; font-size: 3.2vh; letter-spacing: .9vh; color: #ffd23f; }
  #lTajuk .nm { font-family: 'Baloo 2'; font-weight: 800; font-size: 11vh; line-height: 1.05; margin-top: .6vh; text-shadow: 0 1vh 3vh rgba(0,0,0,.45); }
  #lTajuk .lb { display: inline-block; margin-top: 2.2vh; padding: .8vh 2vw; border-radius: 99px; background: rgba(255,255,255,.16); border: .25vh solid rgba(255,255,255,.4); font-weight: 800; font-size: 2.4vh; letter-spacing: .3vh; }
  #lTajuk .bar { width: min(560px, 50vw); height: 1vh; margin: 4vh auto 0; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
  #lTajuk .bar i { display: block; height: 100%; width: 100%; background: #ffd23f; transform-origin: left; animation: barT 3s linear both; }
  @keyframes masukT { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes lompatT { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-1.6vh) rotate(4deg); } }
  @keyframes barT { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  /* ===== papan mata selepas aktiviti ===== */
  #lPapan { position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; padding: 3vh 3vw; background: rgba(3,12,22,.78); backdrop-filter: blur(5px); }
  .pkad { width: min(1300px, 94vw); background: linear-gradient(180deg, #0e2a42, #071a2b); color: #f4f8ff; border: .4vh solid #ffd23f; border-radius: 3.2vh; padding: 3vh 2.6vw; box-shadow: 0 0 7vh rgba(255,210,63,.35); animation: masukP .55s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes masukP { from { transform: scale(.85) translateY(4vh); opacity: 0; } to { transform: none; opacity: 1; } }
  .pkad h2 { margin: 0; font-family: 'Baloo 2'; font-weight: 800; font-size: 5.2vh; text-align: center; }
  .pkad .terbaik { text-align: center; font-family: 'Baloo 2'; font-weight: 800; font-size: 3.4vh; color: #ffd23f; margin: .6vh 0 2vh; }
  .pkad .nota { text-align: center; color: #9fb4cc; font-size: 1.9vh; margin-top: -1.4vh; margin-bottom: 1.6vh; }
  .pbaris { display: grid; grid-template-columns: 5vh 7vh 1fr auto auto; align-items: center; gap: 1.2vw; padding: .9vh 1.2vw; border-radius: 1.8vh; background: rgba(255,255,255,.05); margin-bottom: .9vh; border: 2px solid transparent; }
  .pbaris.fokus { border-color: #1de9b6; background: rgba(29,233,182,.12); transition: background .3s, border-color .3s; }
  .pbaris { position: relative; }
  .pbaris.naik { z-index: 2; box-shadow: 0 0 3vh rgba(255,210,63,.55); }
  .pbaris .tb.pop { animation: popT .45s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes popT { from { transform: scale(.2) translateY(1vh); opacity: 0; } to { transform: none; opacity: 1; } }
  .pbaris .rk { font-family: 'Baloo 2'; font-weight: 800; font-size: 3.4vh; text-align: center; }
  .pbaris .av { width: 6.4vh; height: 6.4vh; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-family: 'Baloo 2'; font-weight: 800; font-size: 3.2vh; color: #fff; background: var(--w); border: .35vh solid rgba(255,255,255,.8); }
  .pbaris .av img { width: 100%; height: 100%; object-fit: cover; }
  .pbaris .nm { font-family: 'Baloo 2'; font-weight: 800; font-size: 3.4vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbaris .tb { font-family: 'Baloo 2'; font-weight: 800; font-size: 3vh; color: #1de9b6; min-width: 8vh; text-align: right; }
  .pbaris .mt { font-family: 'Baloo 2'; font-weight: 800; font-size: 4vh; color: #ffd23f; min-width: 12vh; text-align: right; }
  .pbaris .mt small { font-size: 1.7vh; color: #9fb4cc; margin-left: .3vw; }
  .pbtn { display: flex; justify-content: center; gap: 1.2vw; margin-top: 2vh; }
  .pbtn button { font-family: 'Baloo 2'; font-weight: 800; font-size: 3vh; border: 0; border-radius: 99px; padding: 1.4vh 3vw; cursor: pointer; }
  .pbtn .lagi { background: #1de9b6; color: #04121a; } .pbtn .lagi:disabled { opacity: .5; cursor: default; }
  .pbtn .menu { background: rgba(255,255,255,.12); color: #fff; }
  #toast { position: fixed; left: 50%; top: 2vh; transform: translate(-50%, -160%); z-index: 70; background: #13334c; color: #fff; font-weight: 700; font-size: 2.2vh; padding: 1vh 2vw; border-radius: 99px; transition: transform .3s; }
  #toast.on { transform: translate(-50%, 0); }
</style>
</head>
<body>
<section id="utama">
  <div class="tajuk">
    <div class="salib" aria-hidden="true"><i></i></div>
    <div><small>KLINIK DR. IZUDDIN</small><h1>Kata Majmuk</h1><p>Jujur Itu Ubat Terbaik · imbas QR sekali, kawal semua langkah dari telefon</p></div>
  </div>
  <div class="badan">
    <div class="langkahL" id="senarai"></div>
    <div class="qrK">
      <h2>📱 Imbas sekali sahaja</h2>
      <p>Buka kamera telefon guru dan imbas kod ini.</p>
      <div id="qr"></div>
      <div class="kod" id="kodBesar">····</div>
      <div class="sambungOk" id="sambungOk"><i></i><span id="sambungTx">Menunggu telefon guru…</span></div>
    </div>
  </div>
</section>

<div id="bingkai"></div>

<div id="jalur" hidden>
  <span class="d" id="dot"></span><span id="jalurTx"></span>
  <button id="btnMenu" title="Menu utama">🏠 Menu</button>
  <button id="btnFs" title="Skrin penuh">⛶</button>
</div>
<div id="mula"><div><button id="btnMula">▶ MULA KELAS</button><p>Klik sekali untuk hidupkan bunyi, suara &amp; muzik</p></div></div>
<section id="lTajuk" hidden></section>
<section id="lPapan" hidden><div class="pkad" id="pkad"></div></section>
<div id="toast"></div>
<script src="/km-suara.js"></script>
<script src="/km-kumpulan.js"></script>
<script src="/km-tajuk.js"></script>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const LS = 'ilmuverseKlinikTV.v1';
const rnd = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => b.toString(16).padStart(2, '0')).join('');
const kodBaru = () => String(1000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 9000));
function toast(t, ms = 2600) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), ms); }

let sesi = null;
try { sesi = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}
if (!sesi || !/^\d{4}$/.test(sesi.kod) || !sesi.kunci) sesi = { kod: kodBaru(), kunci: rnd(16) };
const simpan = () => { try { localStorage.setItem(LS, JSON.stringify(sesi)); } catch (e) {} };
simpan();

// Langkah ikut RPH. 'url' = skrin TV setiap sistem (dimuat dalam iframe, kod bilik sama).
const q = () => `embed=1&bilik=${sesi.kod}&kunci=${sesi.kunci}`;
const LANGKAH = [
  { id: 'jantung', jen: 'SISTEM PEMASA', ik: '💓', w: '#ff4d6d', lbl: 'ALAT KELAS', nama: 'Pemasa Jantung', ds: '6 pesakit, 6 kumpulan. Tekan kumpulan yang siap.', url: () => `/pemasa-jantung.html?${q()}` },
  { id: 'kapsul', jen: 'SISTEM SEMAKAN', ik: '💊', w: '#e8434f', lbl: 'LANGKAH 1', nama: 'Semak Pantas Kapsul', ds: 'Misi Imbasan X-Ray Kata Majmuk. Gambar kapsul, TV dedah BETUL / TIDAK TEPAT.', url: () => `/kapsul-skrin.html?${q()}` },
  { id: 'makmal', jen: 'PERMAINAN KAWALAN TANGAN', ik: '✊', w: '#14a394', lbl: 'LANGKAH 2', nama: 'Farmasi Genggam Kata Majmuk', ds: 'Genggam & cantum perkataan / gambar jadi kata majmuk (kawalan tangan).', url: () => '/makmal-ubat.html?embed=1', malas: true },
  { id: 'galeri', jen: 'SISTEM SEMAKAN', ik: '📸', w: '#0d9488', lbl: 'LANGKAH 2', nama: 'Galeri Bukti', ds: 'Gambar semua lembaran, jawapan, maksud, kemudian cop BETUL / TIDAK TEPAT.', url: () => `/galeri-skrin.html?${q()}` },
  { id: 'sijil', jen: 'SISTEM SEMAKAN', ik: '📜', w: '#16a34a', lbl: 'LANGKAH 3', nama: 'Semak & Cop Sijil', ds: 'Susun ayat dan cop DIDAFTARKAN.', url: () => `/sijil-skrin.html?${q()}` },
  { id: 'mata', jen: 'SISTEM MATA', ik: '🏆', w: '#d4a106', lbl: 'PAPAN MATA', nama: 'Papan Mata Kumpulan', ds: 'Mata 6 kumpulan & pemenang (3 terbaik).', url: () => '/papan-mata.html?embed=1' },
];
const FR = {};
function binaFrame(L) {
  const f = document.createElement('iframe'); f.className = 'sis'; f.title = L.nama;
  f.setAttribute('allow', 'camera; microphone; autoplay; fullscreen');
  f.src = L.url(); $('bingkai').appendChild(f); FR[L.id] = f;
  f.addEventListener('load', () => { if (aktif === L.id && dibuka) tunjukFrame(L.id, true); });
  return f;
}
// Muat semua sistem dari awal (supaya bilik wujud bila telefon bertukar langkah). Sambung Tulang dimuat bila dipilih (kamera).
LANGKAH.forEach((L) => { if (!L.malas) binaFrame(L); });

$('senarai').innerHTML = LANGKAH.map((L) => `<div class="lk" data-id="${L.id}" style="--w:${L.w}"><div class="ik">${L.ik}</div><div><div class="tg"><small>${L.lbl}</small>${L.nama}</div><div class="ds">${L.ds}</div></div></div>`).join('');
$('senarai').onclick = (e) => { const el = e.target.closest('.lk'); if (el) pilih(el.dataset.id); };

// ---------- QR satu kali ----------
const telUrl = () => `${location.origin}/km-masuk?next=${encodeURIComponent('/klinik-telefon.html?bilik=' + sesi.kod)}`;
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function lukisKod() {
  $('kodBesar').textContent = sesi.kod;
  try { if (!window.qrcode) await loadScript('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'); const qr = window.qrcode(0, 'M'); qr.addData(telUrl()); qr.make(); $('qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 1, scalable: true }); }
  catch (e) { $('qr').innerHTML = '<div style="padding:20px;font-weight:700;line-height:1.4">Buka ilmuverse.my di telefon,<br>tekan avatar, kemudian masukkan kod ' + sesi.kod + '</div>'; }
}

// ---------- tukar langkah ----------
let aktif = 'utama', dibuka = false, bilTel = 0, wsOk = false;
function tunjukFrame(id, on) { const f = FR[id]; try { f && f.contentWindow && f.contentWindow.__embed && f.contentWindow.__embed.tunjuk(on); } catch (e) {} }
// skrin tajuk 3 saat setiap kali sistem dibuka
let tajukT = [];
function nadaT(f, m, t, v) { try { const a = KMSuara.audio(); if (!a || !dibuka) return; const o = a.createOscillator(), g = a.createGain(), s = a.currentTime + m; o.type = 'triangle'; o.frequency.setValueAtTime(f, s); g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(v, s + .02); g.gain.exponentialRampToValueAtTime(.0001, s + t); o.connect(g).connect(KMSuara.keluaran()); o.start(s); o.stop(s + t + .05); } catch (e) {} }
function tunjukTajuk(L) { if (window.KMTajuk) KMTajuk.tunjuk(L); }
function paparkan(id) {
  const lama = aktif; aktif = id;
  const L = LANGKAH.find((x) => x.id === id);
  if (L && L.malas && !FR[id]) binaFrame(L);
  Object.keys(FR).forEach((k) => FR[k].classList.toggle('on', k === id));
  $('utama').hidden = id !== 'utama';
  $('jalur').hidden = id === 'utama';
  $('jalurTx').textContent = L ? `${L.ik} ${L.nama}` : '';
  // senyapkan sistem lama, hidupkan sistem baharu
  if (lama !== id) { if (FR[lama]) tunjukFrame(lama, false); }
  if (lama !== id) tunjukTajuk(L);
  // sistem baharu mula bersuara selepas skrin tajuk
  if (dibuka && FR[id]) { if (lama !== id && L) tajukT.push(setTimeout(() => { if (aktif === id) tunjukFrame(id, true); }, 2000)); else tunjukFrame(id, true); }
  // tutup kamera Sambung Tulang bila keluar
  if (lama === 'makmal' && id !== 'makmal' && FR.makmal) { FR.makmal.remove(); delete FR.makmal; } // tutup kamera
  if (L) { try { FR[id].focus(); } catch (e) {} }
}
function pilih(id) { if (!hantar({ jenis: 'pilih', aktif: id })) paparkan(id); }

$('btnMula').onclick = () => {
  dibuka = true; $('mula').hidden = true; try { window.KMSuara && KMSuara.audio(); } catch (e) {}
  // Satu klik di sini membuka bunyi untuk semua sistem (iframe asal yang sama).
  Object.keys(FR).forEach((k) => tunjukFrame(k, k === aktif));
};
$('btnMenu').onclick = () => pilih('utama');
$('btnFs').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); };
let idleT = null;
const bangun = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3500); };
addEventListener('pointermove', bangun); bangun();

function kemasSambung() {
  $('dot').classList.toggle('ok', wsOk && bilTel > 0);
  $('sambungOk').classList.toggle('ok', bilTel > 0);
  $('sambungTx').textContent = !wsOk ? 'Menyambung ke pelayan…' : bilTel > 0 ? `Telefon guru bersambung (${bilTel}). Pilih langkah di telefon.` : 'Menunggu telefon guru…';
}

// ---------- WebSocket klinik ----------
let ws = null, tunda = 800, pingT = null;
function hantar(o) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; } return false; }
function sambung() {
  try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/klinik-km?bilik=${sesi.kod}&peranan=paparan&kunci=${sesi.kunci}`); } catch (e) { return ulang(); }
  ws.onopen = () => { wsOk = true; tunda = 800; kemasSambung(); clearInterval(pingT); pingT = setInterval(() => hantar({ jenis: 'ping' }), 20000); };
  ws.onmessage = (ev) => {
    let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.kini) beza = d.kini - Date.now();
    if (d.jenis === 'keadaan') {
      const naik = (d.telefon || 0) > bilTel; bilTel = d.telefon || 0; kemasSambung();
      if (naik) toast('📱 Telefon guru bersambung');
      if (d.aktif !== aktif) paparkan(d.aktif);
      urusPapan(d.papan);
    } else if (d.jenis === 'kelas') {
      muatKelasSemua();
    } else if (d.jenis === 'perintah') {
      try { const w = FR[d.sasaran] && FR[d.sasaran].contentWindow; if (w && w.__perintah) w.__perintah(d.arahan); } catch (e) {}
    } else if (d.jenis === 'podium') {
      paparkan('mata');
      const cuba = (n) => { const w = FR.mata && FR.mata.contentWindow; if (w && w.__papan) w.__papan.podium(); else if (n < 30) setTimeout(() => cuba(n + 1), 200); };
      cuba(0);
    }
  };
  ws.onclose = (ev) => {
    wsOk = false; kemasSambung(); clearInterval(pingT);
    if (ev.code === 4001) { sesi = { kod: kodBaru(), kunci: rnd(16) }; simpan(); location.reload(); return; }
    ulang();
  };
  ws.onerror = () => {};
}
function ulang() { setTimeout(sambung, tunda); tunda = Math.min(tunda * 1.7, 8000); }

// ---------- PAPAN MATA selepas setiap aktiviti ----------
let beza = 0, papanKini = null, papanT = null, kiraT = null;
const kini = () => Date.now() + beza;
const escH = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function muatKelasSemua() {
  if (window.KMKumpulan) KMKumpulan.muat();
  Object.keys(FR).forEach((k) => { try { const w = FR[k].contentWindow; w && w.KMKumpulan && w.KMKumpulan.muat(); } catch (e) {} });
}
function urusPapan(p) {
  const id = p ? p.id : null;
  if (id === (papanKini && papanKini.id)) return;
  clearTimeout(papanT); clearInterval(kiraT); papanKini = p;
  if (!p) { $('lPapan').hidden = true; return; }
  // tunggu animasi tamat sistem itu dahulu, kemudian papar
  papanT = setTimeout(async () => { await (window.KMKumpulan ? KMKumpulan.muat() : null); if (papanKini && papanKini.id === id) tunjukPapan(p); }, Math.max(0, p.mulaPada - kini()));
}
function bunyiTik(f, v) { try { const a = KMSuara.audio(); if (!a || !dibuka) return; const o = a.createOscillator(), g = a.createGain(), t = a.currentTime; o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + .09); o.connect(g).connect(KMSuara.keluaran()); o.start(t); o.stop(t + .1); } catch (e) {} }
// Animasi ringkas (~2 saat): +mata muncul, nombor naik, kemudian kumpulan bergerak ke kedudukan baharu.
function animasiPapan(lama, baru, tambah, susun, pangkatDari, lencana) {
  const baris = (g) => document.querySelector(`#pSenarai .pbaris[data-g="${g}"]`);
  setTimeout(() => {
    [0, 1, 2, 3, 4, 5].forEach((g) => { const t = tambah[g] || 0; if (!t) return; const el = baris(g); if (!el) return;
      el.classList.add('fokus'); const tb = el.querySelector('.tb'); tb.textContent = (t > 0 ? '+' : '') + t; tb.classList.add('pop'); });
    const mula = performance.now(), T = 800; let akhirTik = 0;
    (function kira(n) { const k = Math.min(1, (n - mula) / T), e = 1 - Math.pow(1 - k, 3);
      [0, 1, 2, 3, 4, 5].forEach((g) => { if (!tambah[g]) return; const el = baris(g); if (el) el.querySelector('.mt b').textContent = Math.round(lama[g] + (baru[g] - lama[g]) * e); });
      if (n - akhirTik > 70 && k < 1) { akhirTik = n; bunyiTik(900 + k * 500, .05); }
      if (k < 1) requestAnimationFrame(kira); else naikTurun(); })(mula);
  }, 350);
  function naikTurun() {
    const box = $('pSenarai'); if (!box) return;
    const urut = susun(baru), pk = pangkatDari(baru, urut), awal = {};
    [...box.children].forEach((el) => { awal[el.dataset.g] = el.getBoundingClientRect().top; });
    urut.forEach((g) => { const el = baris(g); if (el) { box.appendChild(el); el.querySelector('.rk').textContent = lencana(pk[g], baru[g]); } });
    let gerak = false;
    [...box.children].forEach((el) => { const d = awal[el.dataset.g] - el.getBoundingClientRect().top; if (!d) return; gerak = true;
      el.style.transition = 'none'; el.style.transform = `translateY(${d}px)`; if (d > 0) el.classList.add('naik');
      requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = 'transform .6s cubic-bezier(.2,.9,.3,1.1)'; el.style.transform = ''; })); });
    if (gerak) bunyiTik(1320, .1);
    setTimeout(() => [...box.children].forEach((el) => el.classList.remove('naik')), 900);
  }
}
function tunjukPapan(p) {
  const KK = window.KMKumpulan, j = (KK && KK.jumlah) || [0, 0, 0, 0, 0, 0];
  const nama = (g) => (KK ? KK.nama(g) : 'Kumpulan ' + (g + 1));
  const tambah = p.tambah || [0, 0, 0, 0, 0, 0];
  const lama = j.map((x, g) => x - (tambah[g] || 0)); // markah sebelum aktiviti ini
  const susun = (m) => [0, 1, 2, 3, 4, 5].sort((a, b) => m[b] - m[a] || a - b);
  const pangkatDari = (m, urut) => { const r = []; let pk = 0, akhir = null; urut.forEach((g, i) => { if (m[g] !== akhir) { pk = i + 1; akhir = m[g]; } r[g] = pk; }); return r; };
  const lencana = (pk, m) => (pk <= 3 && m > 0 ? ['🥇', '🥈', '🥉'][pk - 1] : pk);
  const maksT = Math.max(...tambah), terbaik = maksT > 0 ? tambah.map((t, g) => ({ t, g })).filter((x) => x.t === maksT).map((x) => nama(x.g)) : [];
  const WARNA = KK ? KK.WARNA : ['#ff5a6a', '#48a8ff', '#3ddc84', '#ffd23f', '#b38cff', '#ff9a3d'];
  const urutLama = susun(lama), pkLama = pangkatDari(lama, urutLama);
  $('pkad').innerHTML = `<h2>${escH(p.ik)} Keputusan · ${escH(p.label)}</h2>
    <div class="terbaik">${terbaik.length ? `🏅 Terbaik: ${terbaik.map(escH).join(', ')} (+${maksT} mata)` : 'Papan mata terkini'}</div>
    ${p.nota ? `<div class="nota">${escH(p.nota)}</div>` : ''}
    <div id="pSenarai">${urutLama.map((g) => { const u = KK && KK.gambar(g);
      return `<div class="pbaris" data-g="${g}" style="--w:${WARNA[g]}"><span class="rk">${lencana(pkLama[g], lama[g])}</span><span class="av">${u ? `<img src="${u}" alt="">` : escH((nama(g).trim()[0] || '?').toUpperCase())}</span><span class="nm">${escH(nama(g))}</span><span class="tb"></span><span class="mt"><b>${lama[g]}</b><small>mata</small></span></div>`; }).join('')}</div>
    <div class="pbtn"><button class="lagi" id="pLagi" disabled>Seterusnya ▶ (5)</button><button class="menu" id="pMenu">🏠 Menu</button></div>`;
  animasiPapan(lama, j, tambah, susun, pangkatDari, lencana);
  $('lPapan').hidden = false;
  let n = 5;
  kiraT = setInterval(() => { n--; const b = $('pLagi'); if (!b) return clearInterval(kiraT); if (n <= 0) { clearInterval(kiraT); b.disabled = false; b.textContent = 'Seterusnya ▶'; } else b.textContent = `Seterusnya ▶ (${n})`; }, 1000);
  $('pLagi').onclick = () => hantar({ jenis: 'tutupPapan' });
  $('pMenu').onclick = () => hantar({ jenis: 'tutupPapan', menu: true });
  if (dibuka && window.KMSuara) { KMSuara.diam(); KMSuara.cakap(terbaik.length ? `Syabas, ${terbaik.join(' dan ')}! Tambah ${maksT} mata.` : 'Papan mata terkini.'); }
}

lukisKod(); kemasSambung(); paparkan('utama'); sambung();
window.__klinik = { get aktif() { return aktif; }, get sesi() { return sesi; }, FR, tunjukPapan };
})();
</script>
