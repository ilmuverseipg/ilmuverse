<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1a2b">
<title>Wad Kecemasan — Telefon Guru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@700;800&display=swap">
<style>
  :root { --malam: #0b1a2b; --panel: #142c46; --garis: rgba(140,200,255,.18); --putih: #f4f8ff; --kabur: #9fb4cc; --ecg: #39ff88; --merah: #ff4d5e; --emas: #ffd23f; --hijau: #22c55e;
    --atas: env(safe-area-inset-top, 0px); --bawah: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; background: var(--malam); color: var(--putih); font-family: 'Fredoka', system-ui, sans-serif; }
  body { padding-bottom: calc(110px + var(--bawah)); }
  button, input { font: inherit; }
  button { cursor: pointer; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(8,20,34,.96); padding: calc(10px + var(--atas)) 14px 10px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--garis); }
  .siren { background: var(--merah); border-radius: 10px; padding: 4px 10px; font-family: 'Baloo 2'; font-weight: 800; font-size: 14px; }
  header b { font-family: 'Baloo 2'; font-weight: 800; font-size: 18px; display: block; line-height: 1; }
  header small { font-size: 12px; color: var(--kabur); display: flex; gap: 6px; align-items: center; margin-top: 2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; display: inline-block; }
  .dot.ok { background: #4ade80; } .dot.wait { background: #ffb020; } .dot.bad { background: var(--merah); }
  header a { margin-left: auto; color: #fff; text-decoration: none; background: rgba(255,255,255,.1); border-radius: 10px; padding: 8px 10px; }
  main { padding: 16px; max-width: 560px; margin: 0 auto; }
  .v { animation: masuk .3s ease both; }
  @keyframes masuk { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  h2 { font-family: 'Baloo 2'; font-weight: 800; font-size: 26px; margin: 2px 0 4px; line-height: 1.05; }
  .sub { color: var(--kabur); margin: 0 0 14px; font-size: 15px; line-height: 1.4; }
  .kad { background: var(--panel); border: 2px solid var(--garis); border-radius: 18px; padding: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gk { border: 3px solid var(--garis); background: var(--panel); color: var(--putih); border-radius: 18px; padding: 14px 12px; text-align: left; display: flex; flex-direction: column; gap: 4px; transition: transform .1s, background .2s, border-color .2s; }
  .gk:active { transform: scale(.96); }
  .gk .n { font-family: 'Baloo 2'; font-weight: 800; font-size: 19px; line-height: 1.05; display: flex; align-items: center; gap: 8px; }
  .gk .n i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .gk .s { font-size: 13.5px; color: var(--kabur); font-weight: 600; }
  .gk.on { background: #12452f; border-color: var(--hijau); }
  .gk.on .s { color: #b8f5cf; }
  .gk.kunci { background: #1f3d3a; border-color: #2e7d6b; }
  .gk.kunci .s { color: #9fe3d2; }
  .btnUtama { width: 100%; border: 0; border-radius: 999px; padding: 16px; font-family: 'Baloo 2'; font-weight: 800; font-size: 20px; color: #fff; background: var(--merah); box-shadow: 0 6px 0 #a82534; }
  .btnUtama:active { transform: translateY(4px); box-shadow: 0 2px 0 #a82534; }
  .btnUtama:disabled { opacity: .45; }
  .btnUtama.hijau { background: var(--hijau); box-shadow: 0 6px 0 #15803d; }
  .btnUtama.emas { background: var(--emas); color: var(--malam); box-shadow: 0 6px 0 #b8901a; }
  .btnKedua { width: 100%; border: 2px solid var(--garis); background: var(--panel); color: var(--putih); border-radius: 14px; padding: 13px; font-weight: 700; font-size: 16px; }
  .kaki { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding: 12px 16px calc(14px + var(--bawah)); background: linear-gradient(180deg, rgba(11,26,43,0), var(--malam) 30%); }
  .kaki .dalam { max-width: 560px; margin: 0 auto; display: grid; gap: 10px; }
  .soalanK .lbl { display: inline-block; background: var(--emas); color: var(--malam); font-family: 'Baloo 2'; font-weight: 800; border-radius: 999px; padding: 0 10px; font-size: 14px; }
  .soalanK .m { font-family: 'Baloo 2'; font-weight: 800; font-size: 21px; line-height: 1.15; margin: 6px 0; }
  .soalanK .j { color: var(--kabur); font-size: 15px; } .soalanK .j b { color: var(--ecg); font-size: 18px; }
  .ringkas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ringkas span { border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; background: rgba(255,255,255,.08); }
  .ringkas span.b { background: #12452f; color: #b8f5cf; }
  .besar { font-family: 'Baloo 2'; font-weight: 800; font-size: 34px; color: var(--emas); line-height: 1; margin: 6px 0; }
  .kadKod { padding: 24px; text-align: center; margin-top: 10vh; }
  .kadKod input { width: 100%; font-family: 'Baloo 2'; font-weight: 800; font-size: 44px; letter-spacing: .3em; text-align: center; border: 3px solid var(--garis); background: var(--malam); color: #fff; border-radius: 16px; padding: 8px; margin: 12px 0; }
  #toast { position: fixed; left: 50%; bottom: calc(110px + var(--bawah)); transform: translate(-50%, 20px); z-index: 40; background: #fff; color: var(--malam); padding: 10px 18px; border-radius: 14px; font-weight: 700; font-size: 14.5px; opacity: 0; transition: all .3s; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header>
  <span class="siren">🚨</span>
  <div><b>Wad Kecemasan</b><small><span class="dot wait" id="dot"></span><span id="statTx">Menyambung…</span></small></div>
  <a href="/wad-kecemasan.html" title="Urus soalan">⚙️</a>
</header>
<main id="utama"></main>
<div class="kaki" id="kaki" hidden><div class="dalam" id="kakiDalam"></div></div>
<div id="toast"></div>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const getar = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
function toast(t, ms = 2600) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), ms); }
const WARNA = ['#ff5a6a', '#48a8ff', '#3ddc84', '#ffd23f', '#b38cff', '#ff9a3d'];
let kod = (new URLSearchParams(location.search).get('bilik') || '').replace(/\D/g, '').slice(0, 6);
let S = null, SET = null, wsOk = false, bilPaparan = 0, paparLama = '', tanda = new Array(6).fill(false), idxTanda = -1;

async function muatSet() { try { const r = await fetch('/api/wad/set', { cache: 'no-store' }); if (r.status === 401) return keLogMasuk(); const j = await r.json(); if (j.ok) SET = j.set; } catch (e) {} }
const namaK = (g) => (SET && SET.kumpulan[g]) || 'Kumpulan ' + (g + 1);
const soalan = (i) => (SET && SET.soalan[i]) || { maksud: '…', km: '…' };
function keLogMasuk() { toast('Sesi tamat. Sila log masuk semula.', 4000); setTimeout(() => location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search), 1400); }
function statusUI(tx, c) { $('statTx').textContent = tx; $('dot').className = 'dot ' + c; }
function kemasStatus() {
  if (!kod) return statusUI('Belum disambung', 'wait');
  if (!wsOk) return statusUI(`Kod ${kod} · menyambung…`, 'wait');
  if (!bilPaparan) return statusUI(`Kod ${kod} · skrin TV tiada`, 'bad');
  statusUI(`Bersambung ke skrin TV ${kod}`, 'ok');
}
function hantar(o) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; } toast('Belum bersambung. Tunggu sebentar…'); return false; }
function papar(nama, html, kakiHtml) {
  const baru = nama !== paparLama; paparLama = nama;
  $('utama').innerHTML = `<div class="${baru ? 'v' : ''}">${html}</div>`;
  $('kaki').hidden = !kakiHtml; $('kakiDalam').innerHTML = kakiHtml || '';
  if (baru) scrollTo(0, 0);
}

function render() {
  if (!kod) return lukisKod();
  if (!S) return papar('tunggu', '<div class="kad kadKod"><h2>Menyambung…</h2><p class="sub">Pastikan skrin TV Wad Kecemasan sudah dibuka.</p></div>');
  if (S.fasa === 'sedia') return lukisSedia();
  if (S.fasa === 'tamat') return lukisTamat();
  if (S.langkah === 'soalan') return lukisTanda();
  if (S.langkah === 'rawat') return lukisRawat();
  if (S.langkah === 'audit') return lukisAudit();
  if (S.langkah === 'auditSiap') return lukisAuditSiap();
}
function lukisKod() {
  papar('kod', `<div class="kad kadKod"><h2>Masukkan kod bilik</h2><p class="sub">Kod 4 digit tertera pada skrin TV.</p><input id="kodIn" inputmode="numeric" maxlength="6" placeholder="····"><button class="btnUtama" id="kodBtn">Sambung</button></div>`);
  $('kodBtn').onclick = () => { const k = $('kodIn').value.replace(/\D/g, ''); if (k.length !== 4) return toast('Masukkan 4 digit kod'); kod = k; history.replaceState(null, '', '?bilik=' + kod); kemasStatus(); render(); sambung(); };
}
function lukisSedia() {
  const dikunci = S.kunciK.filter(Boolean).length;
  papar('sedia', `<h2>Kunci jawapan</h2><p class="sub">Bila kumpulan siap menampal picagari, ketik nama kumpulan untuk <b>kunci jawapan</b>. Ketik sekali lagi untuk buka kunci.</p>
    <div class="grid">${[0, 1, 2, 3, 4, 5].map((g) => `<button class="gk ${S.kunciK[g] ? 'kunci' : ''}" data-g="${g}"><span class="n"><i style="background:${WARNA[g]}"></i>${esc(namaK(g))}</span><span class="s">${S.kunciK[g] ? '🔒 Dikunci #' + S.kunciK[g] : 'Belum siap'}</span></button>`).join('')}</div>`,
    `<button class="btnUtama" id="btnMula">🚨 MULA DEDAH (${dikunci}/6 dikunci)</button>`);
  document.querySelectorAll('.gk').forEach((b) => b.onclick = () => { getar(15); hantar({ jenis: 'kunci', g: +b.dataset.g }); });
  $('btnMula').onclick = () => {
    if (dikunci < 6 && !confirm(`${6 - dikunci} kumpulan belum dikunci. Teruskan dedah jawapan?`)) return;
    getar([20, 30, 20]); hantar({ jenis: 'mula', bilSoalan: SET ? SET.soalan.length : 4 });
  };
}
function lukisTanda() {
  if (idxTanda !== S.idx) { idxTanda = S.idx; tanda = new Array(6).fill(false); }
  const s = soalan(S.idx);
  papar('tanda-' + S.idx, `<div class="kad soalanK"><span class="lbl">MAKSUD ${S.idx + 1} / ${S.bilSoalan}</span><div class="m">${esc(s.maksud)}</div><div class="j">Jawapan: <b>${esc(s.km)}</b></div></div>
    <p class="sub" style="margin-top:14px">Selepas TV dedah jawapan, ketik kumpulan yang angkat <b style="color:var(--ecg)">Kad Jujur HIJAU ✓</b>.</p>
    <div class="grid">${[0, 1, 2, 3, 4, 5].map((g) => `<button class="gk ${tanda[g] ? 'on' : ''}" data-g="${g}"><span class="n"><i style="background:${WARNA[g]}"></i>${esc(namaK(g))}</span><span class="s">${tanda[g] ? '✓ Kad hijau' : 'Ketik jika ✓'}</span></button>`).join('')}</div>`,
    `<button class="btnUtama hijau" id="btnRawat">💉 RAWAT PESAKIT</button>`);
  document.querySelectorAll('.gk').forEach((b) => b.onclick = () => { const g = +b.dataset.g; tanda[g] = !tanda[g]; getar(10); b.classList.toggle('on', tanda[g]); b.querySelector('.s').textContent = tanda[g] ? '✓ Kad hijau' : 'Ketik jika ✓'; });
  $('btnRawat').onclick = () => { getar([20, 30, 20]); hantar({ jenis: 'tanda', betul: tanda.slice() }); };
}
function ringkas() {
  const row = S.betul[S.idx] || [];
  return `<div class="ringkas">${[0, 1, 2, 3, 4, 5].map((g) => `<span class="${row[g] ? 'b' : ''}">${row[g] ? '✓' : '·'} ${esc(namaK(g))}</span>`).join('')}</div>`;
}
const akhir = () => S.idx >= S.bilSoalan - 1;
function lukisRawat() {
  const s = soalan(S.idx);
  papar('rawat-' + S.idx, `<div class="kad soalanK"><span class="lbl">MAKSUD ${S.idx + 1} / ${S.bilSoalan}</span><div class="j" style="margin-top:6px">Jawapan: <b>${esc(s.km)}</b></div>${ringkas()}</div>
    <p class="sub" style="margin-top:14px">Pesakit sedang dirawat di TV. Mahu jalankan <b>Audit Doktor Besar</b>? Roda akan pilih satu kumpulan secara rawak untuk disemak.</p>`,
    `<button class="btnUtama emas" id="btnAudit">🎯 AUDIT DOKTOR BESAR</button><button class="btnKedua" id="btnNext">${akhir() ? '🏁 TAMAT & PAPAN AKHIR' : 'Langkau audit · SETERUSNYA ▶'}</button>`);
  $('btnAudit').onclick = () => { getar(20); hantar({ jenis: 'audit' }); };
  $('btnNext').onclick = () => { getar(15); hantar({ jenis: 'seterusnya' }); };
}
function lukisAudit() {
  const a = S.audit[S.idx]; if (!a) return;
  const s = soalan(S.idx), angkat = (S.betul[S.idx] || [])[a.g];
  papar('audit-' + S.idx, `<div class="kad" style="text-align:center"><div class="sub" style="margin:0">🎯 Audit Doktor Besar</div><div class="besar">${esc(namaK(a.g))}</div>
      <div class="sub" style="margin:6px 0 0">Kumpulan ini angkat: <b style="color:${angkat ? 'var(--ecg)' : 'var(--merah)'}">${angkat ? 'Kad HIJAU ✓' : 'Kad MERAH ✗'}</b></div></div>
    <div class="kad soalanK" style="margin-top:12px"><span class="lbl">MAKSUD ${S.idx + 1}</span><div class="m">${esc(s.maksud)}</div><div class="j">Jawapan betul: <b>${esc(s.km)}</b></div></div>
    <p class="sub" style="margin-top:14px">Semak poster kumpulan ini. Adakah kad yang mereka angkat sama dengan jawapan pada poster?</p>`,
    `<button class="btnUtama hijau" id="btnJujur">✅ PENGAKUAN JUJUR</button><button class="btnKedua" id="btnTidak">⚠️ Pengakuan tidak tepat</button>`);
  $('btnJujur').onclick = () => { getar([20, 30, 20]); hantar({ jenis: 'hasilAudit', jujur: true }); };
  $('btnTidak').onclick = () => { getar(30); hantar({ jenis: 'hasilAudit', jujur: false }); };
}
function lukisAuditSiap() {
  const a = S.audit[S.idx];
  papar('auditSiap-' + S.idx, `<div class="kad" style="text-align:center"><div class="besar">${a.hasil === 'jujur' ? '⭐ Lencana Jujur' : '⚠️ Tidak tepat'}</div>
      <div class="sub" style="margin:6px 0 0">${esc(namaK(a.g))}: ${a.hasil === 'jujur' ? 'pengakuan jujur. +1 bintang.' : 'pengakuan tidak tepat. Pesakit demam semula.'}</div></div>${ringkas()}`,
    `<button class="btnUtama" id="btnNext">${akhir() ? '🏁 TAMAT & PAPAN AKHIR' : 'SETERUSNYA ▶'}</button>`);
  $('btnNext').onclick = () => { getar(15); hantar({ jenis: 'seterusnya' }); };
}
function lukisTamat() {
  papar('tamat', `<div class="kad" style="text-align:center"><div class="besar">🏁 Tamat</div><p class="sub" style="margin:6px 0 0">Papan <b>Pesakit Sembuh</b> dan <b>Doktor Paling Jujur</b> dipaparkan di TV.</p></div>`,
    `<button class="btnKedua" id="btnUlang">🔁 Main semula (kosongkan semua)</button>`);
  $('btnUlang').onclick = () => { if (confirm('Kosongkan semua markah dan mula semula?')) hantar({ jenis: 'ulang' }); };
}

let ws = null, tunda = 800, pingT = null;
function sambung() {
  if (!kod) return;
  try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/wad-km?bilik=${kod}&peranan=telefon`); } catch (e) { return ulang(); }
  ws.onopen = () => { wsOk = true; tunda = 800; kemasStatus(); clearInterval(pingT); pingT = setInterval(() => { try { ws.send('{"jenis":"ping"}'); } catch (e) {} }, 20000); };
  ws.onmessage = (ev) => {
    let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.jenis === 'keadaan') { S = d; bilPaparan = d.paparan || 0; kemasStatus(); paparLama = paparLama === 'sedia' ? '' : paparLama; if (!SET) muatSet().then(render); else render(); }
    else if (d.jenis === 'bilangan') { bilPaparan = d.paparan || 0; kemasStatus(); }
  };
  ws.onclose = (ev) => {
    wsOk = false; clearInterval(pingT); kemasStatus();
    if (ev.code === 4003) return keLogMasuk();
    if (ev.code === 4004) { bilPaparan = 0; statusUI(`Skrin ${kod} tiada. Buka skrin TV Wad Kecemasan di PC.`, 'bad'); tunda = 3000; }
    if (ev.code === 4000) { kod = ''; S = null; render(); return toast('Kod bilik tidak sah'); }
    ulang();
  };
  ws.onerror = () => {};
}
function ulang() { setTimeout(sambung, tunda); tunda = Math.min(tunda * 1.6, 6000); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && kod && (!ws || ws.readyState > 1)) { tunda = 200; sambung(); } });
kemasStatus(); render(); if (kod) { muatSet(); sambung(); }
window.__tel = { get S() { return S; }, get paparan() { return paparLama; } };
})();
</script>
<script src="/km-amaran.js"></script>
</body>
</html>
