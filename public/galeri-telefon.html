<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1a2b">
<title>Galeri Bukti — Telefon Guru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@700;800&display=swap">
<style>
  html.embed header { display: none !important; }
  :root { --malam: #0b1a2b; --panel: #142c46; --garis: rgba(140,200,255,.18); --putih: #f4f8ff; --kabur: #9fb4cc; --ecg: #39ff88; --merah: #ff4d5e; --emas: #ffd23f; --hijau: #22c55e; --teal: #14a394;
    --atas: env(safe-area-inset-top, 0px); --bawah: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; background: var(--malam); color: var(--putih); font-family: 'Fredoka', system-ui, sans-serif; }
  body { padding-bottom: calc(150px + var(--bawah)); }
  button, input { font: inherit; } button { cursor: pointer; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(8,20,34,.96); padding: calc(10px + var(--atas)) 14px 10px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--garis); }
  .ikon { background: var(--teal); border-radius: 10px; padding: 4px 10px; font-size: 16px; }
  header b { font-family: 'Baloo 2'; font-weight: 800; font-size: 18px; display: block; line-height: 1; }
  header small { font-size: 12px; color: var(--kabur); display: flex; gap: 6px; align-items: center; margin-top: 2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; display: inline-block; }
  .dot.ok { background: #4ade80; } .dot.wait { background: #ffb020; } .dot.bad { background: var(--merah); }
  main { padding: 14px 16px; max-width: 560px; margin: 0 auto; }
  .v { animation: masuk .3s ease both; }
  @keyframes masuk { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  h2 { font-family: 'Baloo 2'; font-weight: 800; font-size: 24px; margin: 2px 0 4px; line-height: 1.05; }
  .sub { color: var(--kabur); margin: 0 0 12px; font-size: 14.5px; line-height: 1.4; }
  .kad { background: var(--panel); border: 2px solid var(--garis); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .lbl { display: inline-block; background: var(--emas); color: var(--malam); font-family: 'Baloo 2'; font-weight: 800; border-radius: 999px; padding: 0 10px; font-size: 14px; }
  .mk { font-family: 'Baloo 2'; font-weight: 800; font-size: 21px; line-height: 1.15; margin: 6px 0; }
  .jw { color: var(--kabur); } .jw b { color: var(--ecg); font-size: 19px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gk { border: 3px solid var(--garis); background: var(--panel); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
  .gk .kp { display: flex; align-items: center; gap: 6px; padding: 7px 9px; font-family: 'Baloo 2'; font-weight: 800; font-size: 16px; line-height: 1.05; }
  .gk .kp i { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .gk .kp span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gk .th { position: relative; aspect-ratio: 4 / 3; background: #0e2236; display: grid; place-items: center; border: 0; padding: 0; color: var(--kabur); font-weight: 700; font-size: 14px; width: 100%; }
  .gk .th img { width: 100%; height: 100%; object-fit: cover; }
  .gk .th .lihat { position: absolute; left: 6px; bottom: 6px; background: rgba(11,26,43,.85); color: #fff; border-radius: 99px; padding: 3px 9px; font-size: 12px; }
  .gk .th .muat { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(11,26,43,.6); color: #fff; }
  .isyB { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 4px; padding: 7px; }
  .isyB button { border: 2px solid var(--garis); background: var(--malam); color: #fff; border-radius: 9px; padding: 6px 0; font-family: 'Baloo 2'; font-weight: 800; font-size: 17px; }
  .isyB button.on { background: var(--emas); color: var(--malam); border-color: var(--emas); }
  .tandaB { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 7px; }
  .tandaB button { border: 2px solid var(--garis); background: var(--malam); color: #fff; border-radius: 10px; padding: 8px 2px; font-family: 'Baloo 2'; font-weight: 800; font-size: 13.5px; line-height: 1.1; }
  .tandaB .ya.on { background: var(--hijau); border-color: var(--hijau); }
  .tandaB .tak.on { background: var(--merah); border-color: var(--merah); }
  .gk .cop { font-size: 12px; font-weight: 700; text-align: center; padding: 0 6px 7px; }
  .gk .cop.jujur { color: #86efac; } .gk .cop.tidak { color: #fca5a5; }
  .kaki { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding: 12px 16px calc(14px + var(--bawah)); background: linear-gradient(180deg, rgba(11,26,43,0), var(--malam) 26%); }
  .kaki .dalam { max-width: 560px; margin: 0 auto; display: grid; gap: 10px; }
  .dua { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btnUtama { width: 100%; border: 0; border-radius: 999px; padding: 16px; font-family: 'Baloo 2'; font-weight: 800; font-size: 20px; color: #fff; background: var(--teal); box-shadow: 0 6px 0 #0b6b61; }
  .btnUtama:active { transform: translateY(4px); box-shadow: 0 2px 0 #0b6b61; }
  .btnUtama.emas { background: var(--emas); color: var(--malam); box-shadow: 0 6px 0 #b8901a; }
  .btnUtama.hijau { background: var(--hijau); box-shadow: 0 6px 0 #15803d; }
  .btnUtama.merah { background: var(--merah); box-shadow: 0 6px 0 #a82534; }
  .btnUtama:disabled { opacity: .45; }
  .btnKedua { width: 100%; border: 2px solid var(--garis); background: var(--panel); color: var(--putih); border-radius: 14px; padding: 13px; font-weight: 700; font-size: 15.5px; }
  .vw { position: relative; height: 52vh; border-radius: 16px; overflow: hidden; background: #0e2236; touch-action: none; margin-bottom: 10px; }
  .vw img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; user-select: none; -webkit-user-drag: none; }
  .vw .zt { position: absolute; right: 8px; top: 8px; background: rgba(11,26,43,.85); border-radius: 99px; padding: 2px 9px; font-size: 13px; font-weight: 700; }
  .vw .bantu { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: rgba(11,26,43,.85); border-radius: 99px; padding: 4px 12px; font-size: 13px; transition: opacity .4s; white-space: nowrap; }
  .fokusKp { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .fokusKp i { width: 14px; height: 14px; border-radius: 50%; }
  .fokusKp b { font-family: 'Baloo 2'; font-weight: 800; font-size: 22px; flex: 1; }
  .fokusKp span { font-family: 'Baloo 2'; font-weight: 800; font-size: 22px; color: var(--emas); }
  .kadKod { padding: 24px; text-align: center; margin-top: 10vh; }
  .kadKod input { width: 100%; font-family: 'Baloo 2'; font-weight: 800; font-size: 44px; letter-spacing: .3em; text-align: center; border: 3px solid var(--garis); background: var(--malam); color: #fff; border-radius: 16px; padding: 8px; margin: 12px 0; }
  .hb { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--garis); font-weight: 700; }
  .hb i { width: 12px; height: 12px; border-radius: 50%; } .hb span { flex: 1; } .hb em { font-style: normal; color: var(--kabur); font-size: 13px; } .hb b { color: var(--emas); font-family: 'Baloo 2'; font-size: 20px; min-width: 36px; text-align: right; }
  /* kamera dalam halaman */
  #kamera { position: fixed; inset: 0; z-index: 30; background: #000; display: flex; flex-direction: column; touch-action: none; }
  #kamera .pentas { flex: 1; position: relative; overflow: hidden; }
  #vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  #pratonton { position: absolute; inset: 0; background: #000; display: grid; place-items: center; }
  #pratonton img { max-width: 94%; max-height: 80%; border-radius: 10px; border: 3px solid #fff; box-shadow: 0 0 22px rgba(57,255,136,.6); }
  .bingkai { position: absolute; pointer-events: none; border: 3px solid rgba(255,255,255,.95); border-radius: 12px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45), 0 0 16px rgba(20,163,148,.9); }
  .bingkai i { position: absolute; background: rgba(255,255,255,.35); }
  .bingkai i.v1, .bingkai i.v2 { top: 0; bottom: 0; width: 1px; } .bingkai i.v1 { left: 33.33%; } .bingkai i.v2 { left: 66.66%; }
  .bingkai i.h1, .bingkai i.h2 { left: 0; right: 0; height: 1px; } .bingkai i.h1 { top: 33.33%; } .bingkai i.h2 { top: 66.66%; }
  .bingkai b { position: absolute; width: 22px; height: 22px; border: 0 solid var(--ecg); }
  .bingkai b.a { left: -3px; top: -3px; border-width: 5px 0 0 5px; border-radius: 12px 0 0 0; } .bingkai b.b { right: -3px; top: -3px; border-width: 5px 5px 0 0; border-radius: 0 12px 0 0; }
  .bingkai b.c { left: -3px; bottom: -3px; border-width: 0 0 5px 5px; border-radius: 0 0 0 12px; } .bingkai b.d { right: -3px; bottom: -3px; border-width: 0 5px 5px 0; border-radius: 0 0 12px 0; }
  .kamAtas { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + var(--atas)) 14px 10px; color: #fff; display: flex; align-items: center; gap: 8px; background: linear-gradient(180deg, rgba(0,0,0,.65), transparent); }
  .kamAtas .kpK { display: flex; align-items: center; gap: 7px; font-family: 'Baloo 2'; font-weight: 800; font-size: 20px; text-shadow: 0 1px 4px #000; }
  .kamAtas .kpK i { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 2px #fff; }
  .kamAtas .titikK { margin-left: auto; display: flex; gap: 5px; }
  .kamAtas .titikK i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.3); } .kamAtas .titikK i.ok { background: var(--ecg); } .kamAtas .titikK i.kini { background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
  .kamTip { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; color: #fff; font-size: 14px; font-weight: 600; text-shadow: 0 1px 4px #000; }
  .zoomBar { position: absolute; left: 50%; bottom: 42px; transform: translateX(-50%); display: flex; gap: 6px; background: rgba(0,0,0,.45); border-radius: 999px; padding: 4px; }
  .zoomBar button { border: 0; border-radius: 999px; background: transparent; color: #fff; font-weight: 700; font-size: 14px; width: 44px; height: 32px; }
  .zoomBar button.on { background: #fff; color: #000; }
  .kamBawah { padding: 14px 18px calc(16px + var(--bawah)); display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #000; min-height: 108px; }
  .kamBawah .kecil { width: 52px; height: 52px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; font-size: 22px; flex: none; }
  #btnSnap { width: 78px; height: 78px; border-radius: 50%; border: 5px solid #fff; background: var(--teal); box-shadow: 0 0 0 4px rgba(20,163,148,.45); flex: none; }
  #btnSnap:active { transform: scale(.9); } #btnSnap:disabled { opacity: .4; }
  .kamSemak { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; width: 100%; }
  .kamSemak button { border: 0; border-radius: 999px; padding: 15px 8px; font-family: 'Baloo 2'; font-weight: 800; font-size: 17px; color: #fff; }
  .kamSemak .ulangB { background: rgba(255,255,255,.16); }
  .kamSemak .lagiB { background: var(--teal); box-shadow: 0 5px 0 #0b6b61; }
  #kamGagal { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 30px; text-align: center; color: #fff; background: #0b1a2b; }
  #kilat { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #kilat.on { animation: kilatK .4s ease-out; }
  @keyframes kilatK { from { opacity: .85; } to { opacity: 0; } }
  .btnBesar { width: 100%; border: 0; border-radius: 20px; padding: 18px 14px; display: flex; align-items: center; gap: 12px; text-align: left; color: #fff; background: linear-gradient(135deg, #14a394, #0b6b61); box-shadow: 0 6px 0 #084c45; margin-bottom: 14px; }
  .btnBesar .ik { font-size: 34px; } .btnBesar b { display: block; font-family: 'Baloo 2'; font-weight: 800; font-size: 21px; line-height: 1.05; } .btnBesar small { font-size: 13.5px; opacity: .9; }
  .kmKad { display: flex; align-items: center; gap: 12px; }
  .kmKad .gbK { width: 64px; height: 64px; border-radius: 14px; background: #fff; display: grid; place-items: center; font-size: 36px; overflow: hidden; flex: none; }
  .kmKad .gbK img { width: 100%; height: 100%; object-fit: contain; }
  #toast { position: fixed; left: 50%; bottom: calc(160px + var(--bawah)); transform: translate(-50%, 20px); z-index: 40; background: #fff; color: var(--malam); padding: 10px 18px; border-radius: 14px; font-weight: 700; font-size: 14.5px; opacity: 0; transition: all .3s; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header>
  <span class="ikon">📸</span>
  <div><b>Galeri Bukti</b><small><span class="dot wait" id="dot"></span><span id="statTx">Menyambung…</span></small></div>
</header>
<main id="utama"></main>
<div class="kaki" id="kaki" hidden><div class="dalam" id="kakiDalam"></div></div>
<div id="kamera" hidden>
  <div class="pentas" id="pentas">
    <video id="vid" playsinline muted autoplay></video>
    <div class="bingkai" id="bingkai" aria-hidden="true"><i class="v1"></i><i class="v2"></i><i class="h1"></i><i class="h2"></i><b class="a"></b><b class="b"></b><b class="c"></b><b class="d"></b></div>
    <div class="kamAtas"><div class="kpK" id="kamKp"></div><div class="titikK" id="kamTitik"></div></div>
    <div class="zoomBar" id="zoomBar"><button data-z="1" class="on">1×</button><button data-z="1.5">1.5×</button><button data-z="2">2×</button></div>
    <div class="kamTip" id="kamTip">Muatkan seluruh lembaran dalam bingkai</div>
    <div id="pratonton" hidden><img id="pratImg" alt="Gambar diambil"></div>
    <div id="kamGagal" hidden><div style="font-size:46px">📷</div><div id="kamGagalTx" style="font-weight:600;line-height:1.4"></div><button class="btnKedua" id="kamCuba" style="width:auto;padding:12px 22px">Cuba lagi</button></div>
    <div id="kilat"></div>
  </div>
  <div class="kamBawah" id="kamBawah"></div>
</div>
<input type="file" id="fail" accept="image/*" capture="environment" hidden>
<div id="toast"></div>
<script src="/km-kumpulan.js"></script>
<script src="/km-nama.js" data-auto="header"></script>
<script>
if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('embed');
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const getar = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function toast(t, ms = 2400) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), ms); }
const KK = window.KMKumpulan, WARNA = KK.WARNA, nama = (g) => KK.nama(g);
const MAX_SISI = 1800, KUALITI = 0.86, NISBAH = 1.414; // lembaran landskap (poster lengan)
let kod = (new URLSearchParams(location.search).get('bilik') || '').replace(/\D/g, '').slice(0, 6);
let S = null, SET = null, wsOk = false, bilPaparan = 0, paparLama = '', lokal = -1;
const thumb = new Array(6).fill(null); // {v, url}
const naik = new Array(6).fill(false);

async function muatSet() { try { const r = await fetch('/api/wad/set', { cache: 'no-store' }); if (r.status === 401) return keLogMasuk(); const j = await r.json(); if (j.ok) SET = j.set; } catch (e) {} }
const soalan = (i) => (SET && SET.soalan[i]) || { maksud: '…', km: '…' };
function keLogMasuk() { toast('Sesi tamat. Membuka semula…', 3000); setTimeout(() => location.href = '/km-masuk?next=' + encodeURIComponent(location.pathname + location.search), 1200); }
function statusUI(tx, c) { $('statTx').textContent = tx; $('dot').className = 'dot ' + c; }
function kemasStatus() {
  if (!kod) return statusUI('Belum disambung', 'wait');
  if (!wsOk) return statusUI(`Kod ${kod} · menyambung…`, 'wait');
  if (!bilPaparan) return statusUI(`Kod ${kod} · skrin TV tiada`, 'bad');
  statusUI(`Bersambung ke skrin TV ${kod}`, 'ok');
}
function hantar(o) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; } toast('Belum bersambung. Tunggu sebentar…'); return false; }
let skrinLama = '';
function papar(nama, html, kakiHtml) {
  // skrol ke atas hanya bila bertukar skrin (bukan bila tanda BETUL / TIDAK TEPAT)
  const k = nama.split('|'), skrin = k[0] === 'soalan' ? k.slice(0, 3).join('|') : (k[0] === 'lokal' || k[0] === 'fokus') ? k.slice(0, 2).join('|') : k[0];
  const baru = skrin !== skrinLama; skrinLama = skrin; paparLama = nama;
  const y = scrollY;
  $('utama').innerHTML = `<div class="${baru ? 'v' : ''}">${html}</div>`;
  $('kaki').hidden = !kakiHtml; $('kakiDalam').innerHTML = kakiHtml || '';
  if (baru) scrollTo(0, 0); else scrollTo(0, y);
}

// ---------- thumbnail dari pelayan ----------
async function muatThumb(g, v) {
  if (!v || (thumb[g] && thumb[g].v >= v)) return;
  try { const r = await fetch(`/api/galeri/${kod}/foto/${g}?v=${v}`, { cache: 'no-store' }); if (r.status === 200) { const url = URL.createObjectURL(await r.blob()); if (thumb[g]) URL.revokeObjectURL(thumb[g].url); thumb[g] = { v, url }; paparLama = ''; render(); } } catch (e) {}
}

// ---------- paparan ----------
function render() {
  if (!kod) return lukisKod();
  if (!S) return papar('tunggu', '<div class="kad kadKod"><h2>Menyambung…</h2><p class="sub">Pastikan skrin TV Galeri Bukti sudah dibuka.</p></div>');
  S.foto.forEach((v, g) => { if (v) muatThumb(g, v); else if (thumb[g]) { URL.revokeObjectURL(thumb[g].url); thumb[g] = null; } });
  if (S.fasa === 'tamat') return lukisTamat();
  if (S.fokus >= 0) return lukisFokus();
  if (S.fasa === 'gambar') return lukisGambar();
  if (lokal >= 0 && S.langkah === 'semak') return lukisLokal();
  lokal = -1;
  return lukisSoalan();
}
function lukisKod() {
  papar('kod', `<div class="kad kadKod"><h2>Masukkan kod bilik</h2><p class="sub">Kod 4 digit tertera pada skrin TV.</p><input id="inKod" inputmode="numeric" maxlength="6" placeholder="0000"><button class="btnUtama" id="btnKod">Sambung</button></div>`);
  $('btnKod').onclick = () => { const v = $('inKod').value.replace(/\D/g, ''); if (v.length < 4) return toast('Kod 4 digit'); kod = v; sambung(); render(); };
}
const thumbHtml = (g, lbl) => { const t = thumb[g]; return `<button class="th" data-th="${g}">${t ? `<img src="${t.url}" alt=""><span class="lihat">${lbl}</span>` : '📷 Ambil gambar'}${naik[g] ? '<span class="muat">Menghantar…</span>' : ''}</button>`; };
// tap gambar: fasa gambar / dedah -> besarkan di TV; semak -> besarkan di telefon sahaja (TV tidak tunjuk)
function pasangThumb() {
  document.querySelectorAll('[data-th]').forEach((b) => b.onclick = () => { const g = +b.dataset.th; if (!thumb[g]) return bukaKam(g, false); getar(10);
    if (S.fasa === 'soalan' && S.langkah === 'semak') { lokal = g; paparLama = ''; render(); } else hantar({ jenis: 'fokus', g }); });
  document.querySelectorAll('[data-semula]').forEach((b) => b.onclick = () => bukaKam(+b.dataset.semula, false));
}
const kadSoalan = (s) => `<div class="kad kmKad"><div class="gbK">${s.uk ? `<img src="${s.uk}" alt="">` : esc(s.ek || '💊')}</div><div><span class="lbl">SOALAN ${S.idx + 1} / ${S.bilSoalan}</span><div class="mk" style="color:var(--ecg)">${esc(s.km)}</div><div class="sub" style="margin:0">${esc(s.maksud)}</div></div></div>`;
const tandaHtml = (g, m) => `<div class="tandaB"><button class="ya ${m === true ? 'on' : ''}" data-g="${g}" data-b="1">✓ BETUL</button><button class="tak ${m === false ? 'on' : ''}" data-g="${g}" data-b="0">✗ TIDAK TEPAT</button></div>`;
function pasangTanda(row) { document.querySelectorAll('.tandaB button').forEach((b) => b.onclick = () => { const g = +b.dataset.g, v = b.dataset.b === '1'; getar(v ? 15 : [15, 30, 15]); hantar({ jenis: 'tanda', g, betul: row[g] === v ? null : v }); }); }
