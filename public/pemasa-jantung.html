<!DOCTYPE html>

<style>
  * { box-sizing: border-box; }

  /* ---------- tetapan ---------- */

  .card { width: min(720px, 96vw); background: linear-gradient(180deg, #0c2733, #071820); border: 3px solid #1de9b6; border-radius: 28px; padding: 24px 28px; box-shadow: 0 0 40px rgba(29,233,182,.35), inset 0 0 30px rgba(29,233,182,.08); text-align: center; }
  .card h1 { margin: 0; font-family: 'Orbitron'; font-weight: 900; font-size: clamp(30px, 5vw, 58px); letter-spacing: 3px; color: #fff; text-shadow: 0 0 18px #1de9b6, 0 0 40px rgba(29,233,182,.6); }
  .card h1 span { color: #ff4d6d; text-shadow: 0 0 18px #ff4d6d; animation: beat 1s infinite; display: inline-block; }
  @keyframes beat { 0%, 60%, 100% { transform: scale(1); } 10% { transform: scale(1.25); } 25% { transform: scale(1.05); } 35% { transform: scale(1.18); } }
  .card .sub { font-weight: 600; color: #8ff5d8; margin: 6px 0 18px; letter-spacing: 2px; font-size: clamp(14px, 1.8vw, 19px); }
  .card label { display: block; text-align: left; font-weight: 700; color: #b9fff0; margin: 12px 0 6px; font-size: 17px; }
  .card input[type=text], .card input[type=number] { width: 100%; font-family: 'Fredoka'; font-weight: 600; font-size: 22px; color: #fff; background: #04121a; border: 2px solid #1b6b66; border-radius: 14px; padding: 10px 14px; outline: none; }
  .card input:focus { border-color: #1de9b6; box-shadow: 0 0 12px rgba(29,233,182,.4); }
  .time { display: flex; gap: 10px; align-items: center; }
  .time input { text-align: center; font-family: 'Orbitron' !important; font-size: 30px !important; }
  .time b { font-family: 'Orbitron'; font-size: 32px; color: #1de9b6; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { font-family: 'Fredoka'; font-weight: 700; font-size: 17px; color: #1de9b6; background: transparent; border: 2px solid #1de9b6; border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  .chip:hover, .chip.on { background: #1de9b6; color: #04121a; }
  .go { margin-top: 22px; font-family: 'Orbitron'; font-weight: 900; font-size: clamp(20px, 2.6vw, 28px); letter-spacing: 3px; color: #04121a; background: linear-gradient(135deg, #1de9b6, #00b0ff); border: none; border-radius: 18px; padding: 14px 40px; cursor: pointer; box-shadow: 0 6px 0 #0a7c78, 0 0 30px rgba(29,233,182,.5); }
  .go:active { transform: translateY(4px); box-shadow: 0 2px 0 #0a7c78; }
  .back { display: inline-block; margin-top: 14px; color: #8ff5d8; font-size: 15px; }

  /* ---------- pembuka 3-2-1 ---------- */
  .intro { position: fixed; inset: 0; z-index: 12; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse at center, rgba(10,40,50,.7), rgba(0,0,0,.94)); padding: 20px; }
  .intro .t1 { font-family: 'Orbitron'; font-weight: 900; font-size: clamp(40px, 8.5vw, 120px); line-height: 1; color: #fff; text-shadow: 0 0 22px #ff4d6d, 0 0 60px rgba(255,77,109,.7); letter-spacing: 4px; animation: zoomIn .7s cubic-bezier(.2,1.4,.4,1) both; }
  .intro .t2 { margin-top: 18px; font-family: 'Baloo 2'; font-weight: 800; font-size: clamp(24px, 4vw, 54px); color: #ffd84d; text-shadow: 0 4px 0 rgba(0,0,0,.5); animation: zoomIn .7s .25s cubic-bezier(.2,1.4,.4,1) both; }
  .intro .t3 { margin-top: 10px; font-family: 'Baloo 2'; font-weight: 800; font-size: clamp(22px, 3.4vw, 44px); color: #b9fff0; animation: zoomIn .7s .5s cubic-bezier(.2,1.4,.4,1) both; }
  .intro .t3 b { font-family: 'Orbitron'; color: #1de9b6; text-shadow: 0 0 16px #1de9b6; }
  .num { position: fixed; inset: 0; z-index: 13; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .num span { font-family: 'Orbitron'; font-weight: 900; font-size: clamp(160px, 34vw, 460px); color: #fff; text-shadow: 0 0 40px #1de9b6, 0 0 120px rgba(29,233,182,.8); animation: countPop .95s ease-out both; }
  .num span.go { color: #ffd84d; font-size: clamp(90px, 18vw, 260px); text-shadow: 0 0 40px #ff9f1c, 0 0 120px rgba(255,159,28,.9); }
  @keyframes zoomIn { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes countPop { 0% { transform: scale(2.6); opacity: 0; filter: blur(12px); } 25% { transform: scale(1); opacity: 1; filter: blur(0); } 75% { transform: scale(.92); opacity: 1; } 100% { transform: scale(.4); opacity: 0; } }

  /* ---------- kawalan ---------- */
  .ctrl { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 8; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .ctrl button, .ctrl a { font-family: 'Fredoka'; font-weight: 700; font-size: clamp(14px, 1.5vw, 18px); color: #e8fff6; background: rgba(4,20,28,.82); border: 2px solid rgba(29,233,182,.55); border-radius: 14px; padding: 8px 14px; cursor: pointer; text-decoration: none; backdrop-filter: blur(4px); }

  .endcard button.alt { background: #8aa0b4; }
</style>

<body>
<canvas id="cv" aria-label="Pemasa jantung dengan monitor ECG dan pesakit"></canvas>

<div class="setup" id="setup">
  <div class="card">
    <h1>PEMASA <span>❤</span> JANTUNG</h1>
    <div class="sub">KLINIK DR. IZUDDIN · WAD KECEMASAN</div>
    <label for="task">Tugasan yang perlu disiapkan</label>
    <input type="text" id="task" maxlength="60" value="Lembaran kerja kata majmuk">
    <label>Masa</label>
    <div class="time"><input type="number" id="mm" min="0" max="99" value="5"><b>:</b><input type="number" id="ss" min="0" max="59" value="0"></div>
    <div class="chips" id="chips"></div>
    <button class="go" id="goBtn">▶ MULA RAWATAN</button><br>
    <a class="back" href="/guru.html">← Kembali ke Ilmuverse</a>
  </div>
</div>

<div class="intro" id="intro" hidden>
  <div class="t1">CEPAT SIAPKAN!</div>
  <div class="t2" id="introTask"></div>
  <div class="t3">dalam masa <b id="introTime">05:00</b></div>
</div>
<div class="num" id="num"></div>

<div class="end" id="end" hidden>
  <div class="endcard" id="endCard">
    <h2 id="endTitle">MASA TAMAT!</h2>
    <p id="endText"></p>
    <div class="row"><button id="againBtn">🔄 Ulang</button><button class="alt" id="setBtn">⚙ Tetapan</button></div>
  </div>
</div>

<div class="ctrl" id="ctrl" hidden>
  <button id="pauseBtn" title="Jeda (Space)">⏸ Jeda</button>
  <button id="addBtn" title="Tambah 30 saat">➕ 30s</button>
  <button class="save" id="saveBtn" title="Semua sudah siap (S)">✅ SIAP! Selamatkan</button>
  <button id="resetBtn">⚙ Tetapan</button>
  <button id="muteBtn" title="Bunyi (M)">🔊</button>
  <button id="fsBtn" title="Skrin penuh (F)">⛶</button>
</div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, U = 1, DT = 0;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
const fmt = (s) => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// =====================================================================
// BUNYI (Web Audio, tiada fail luar)
// =====================================================================
let AC = null, master = null, muted = false, flatOsc = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.8; const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'sine', v = 0.2, f2 = null, delay = 0) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.008); g.gain.setValueAtTime(v, t + d * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
}
function noise(d, v = 0.3, freq = 1200, delay = 0) {
  const a = ac(); if (!a || muted) return;
  const len = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = v;
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(master); s.start(a.currentTime + delay);
}
const SFX = {
  beat(pitch, v) { tone(pitch, 0.07, 'sine', v); },
  // degupan jantung "dup-dup" (lub-dub): v = kekuatan bunyi
  dupdup(v, gap) {
    tone(100, 0.14, 'sine', v, 55); tone(200, 0.05, 'triangle', v * 0.25, 120);
    tone(115, 0.11, 'sine', v * 0.75, 65, gap); tone(230, 0.04, 'triangle', v * 0.2, 140, gap);
  },
  alarm() { [0, 0.18, 0.36].forEach((d) => tone(988, 0.12, 'square', 0.09, null, d)); [0.7, 0.88].forEach((d) => tone(988, 0.12, 'square', 0.09, null, d)); },
  tick() { tone(1500, 0.04, 'square', 0.07); },
  count() { tone(660, 0.22, 'square', 0.12); tone(330, 0.3, 'sine', 0.2); },
  go() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'square', 0.1, null, i * 0.07)); noise(0.5, 0.15, 3000); },
  whoosh() { noise(0.6, 0.25, 1800); tone(180, 0.6, 'sine', 0.12, 900); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.3, 'triangle', 0.2, null, i * 0.12)); },
  shock() { noise(0.5, 0.5, 4000); tone(90, 0.5, 'sawtooth', 0.15, 40); },
};
function flatline(on) {
  const a = ac(); if (!a) return;
  if (on && !flatOsc && !muted) {
    const o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = 1000;
    g.gain.setValueAtTime(0.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(0.18, a.currentTime + 0.05);
    g.gain.setValueAtTime(0.18, a.currentTime + 4); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 6);
    o.connect(g); g.connect(master); o.start(); o.stop(a.currentTime + 6.1); flatOsc = o; o.onended = () => { if (flatOsc === o) flatOsc = null; };
  } else if (!on && flatOsc) { try { flatOsc.stop(); } catch (e) {} flatOsc = null; }
}
let voice = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); voice = vs.find((v) => /^ms/i.test(v.lang)) || vs.find((v) => /^id/i.test(v.lang)) || null; } catch (e) {} }
try { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); } catch (e) {}
function speak(t) { try { if (muted || !window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'ms-MY'; u.rate = 1.05; speechSynthesis.speak(u); } catch (e) {} }
function durWords(sec) { const m = Math.floor(sec / 60), s = sec % 60; return (m ? m + ' minit' : '') + (m && s ? ' ' : '') + (s ? s + ' saat' : ''); }

// =====================================================================
// KEADAAN
// =====================================================================
let state = 'setup'; // setup | intro | run | paused | flat | saved
let total = 300, remain = 300, bpm = 78, bpmT = 78, spo2 = 98, phase = 0, pphase = 0, beatFlash = 0, lastSec = -1, alarmT = 0, flatT = 0, saveT = 0;
let mon = {}, scr = {}, ecg = {}, pleth = {}, pat = {}, ecgBuf = [], plBuf = [], wpos = 0, stars = [], particles = [];
const PRESETS = [[0, 30], [1, 0], [2, 0], [3, 0], [5, 0], [10, 0]];

function level() {
  if (state === 'flat') return 4;
  if (state === 'saved') return 0;
  const f = total > 0 ? remain / total : 1;
  if (remain <= 10) return 3;
  if (f <= 0.25 || remain <= 30) return 2;
  if (f <= 0.5) return 1;
  return 0;
}
const LV = [
  { bpm: 78, spo2: 98, col: '#39ff88', name: 'STABIL', say: 'Saya rasa sihat! Teruskan kerja ya 😊' },
  { bpm: 104, spo2: 95, col: '#ffd84d', name: 'BERWASPADA', say: 'Eh… cepat sikit, doktor kecil!' },
  { bpm: 132, spo2: 90, col: '#ff9f1c', name: 'KRITIKAL', say: 'Alamak! Masa hampir habis! 😰' },
  { bpm: 162, spo2: 84, col: '#ff3b5c', name: 'KECEMASAN!', say: 'TOLONG!! Cepat siapkan! 😱' },
  { bpm: 0, spo2: 0, col: '#ff3b5c', name: 'FLATLINE', say: '' },
];

// =====================================================================
// SUSUN ATUR
// =====================================================================
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; U = Math.min(W / 1366, H / 768);
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const portrait = W < H * 1.15;
  if (portrait) { mon = { x: W * 0.03, y: H * 0.04, w: W * 0.94, h: H * 0.56 }; pat = { x: W * 0.05, y: H * 0.62, w: W * 0.9, h: H * 0.3 }; }
  else { mon = { x: W * 0.025, y: H * 0.05, w: W * 0.635, h: H * 0.84 }; pat = { x: W * 0.675, y: H * 0.1, w: W * 0.31, h: H * 0.78 }; }
  const b = Math.max(12, mon.w * 0.025);
  scr = { x: mon.x + b, y: mon.y + b * 1.6, w: mon.w - b * 2, h: mon.h - b * 3.2 };
  ecg = { x: scr.x + scr.w * 0.02, y: scr.y + scr.h * 0.12, w: scr.w * 0.66, h: scr.h * 0.36 };
  pleth = { x: ecg.x, y: scr.y + scr.h * 0.5, w: ecg.w, h: scr.h * 0.12 };
  const n = Math.max(10, Math.round(ecg.w));
  ecgBuf = new Array(n).fill(null); plBuf = new Array(n).fill(null); wpos = 0;
  stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random() * 0.5, r: rand(0.5, 1.6), p: rand(0, 6) }));
}

// =====================================================================
// GELOMBANG ECG & PLETH
// =====================================================================
const gauss = (x, m, s) => Math.exp(-((x - m) * (x - m)) / (2 * s * s));
function ecgWave(p, lv) {
  const k = lv >= 3 ? 1.15 : 1;
  return 0.12 * gauss(p, 0.12, 0.025) - 0.14 * gauss(p, 0.215, 0.008) + 1.0 * k * gauss(p, 0.24, 0.011) - 0.3 * gauss(p, 0.265, 0.01) + 0.28 * gauss(p, 0.46, 0.045);
}
const plethWave = (p) => gauss(p, 0.36, 0.08) + 0.35 * gauss(p, 0.62, 0.05);
function advanceTrace(dt) {
  const lv = level(), n = ecgBuf.length, speed = ecg.w / 4.2;
  let cols = speed * dt;
  while (cols > 0) {
    const step = Math.min(1, cols); cols -= step;
    const pPrev = phase;
    if (state === 'flat') { phase = 0; }
    else { phase += (bpm / 60) / speed * step; pphase += (bpm / 60) / speed * step; }
    if (pPrev < 0.24 && phase >= 0.24 && state !== 'flat') onBeat();
    if (phase >= 1) phase -= 1; if (pphase >= 1) pphase -= 1;
    wpos = (wpos + step) % n; const i = Math.floor(wpos);
    const flat = state === 'flat';
    ecgBuf[i] = flat ? rand(-0.01, 0.01) : ecgWave(phase, lv) + rand(-0.015, 0.015) + (lv >= 3 ? Math.sin(wpos * 0.9) * 0.02 : 0);
    plBuf[i] = flat ? 0 : plethWave((pphase + 0.85) % 1) * (lv >= 3 ? 0.7 : 1);
  }
}
function onBeat() {
  beatFlash = 1;
  const lv = level();
  if (state === 'run' || state === 'saved' || state === 'intro' || state === 'setup' || state === 'paused') {
    if (state === 'paused' || state === 'setup') return;
    // masa banyak: dup-dup perlahan sahaja; hampir tamat: makin kuat + bunyi "tit" monitor
    const V = [0.07, 0.11, 0.24, 0.42][Math.min(lv, 3)], gap = clamp(60 / Math.max(bpm, 40) * 0.32, 0.12, 0.24);
    SFX.dupdup(state === 'intro' ? 0.05 : V, gap);
    if (lv >= 2 && state === 'run') SFX.beat(lv >= 3 ? 980 : 880, lv >= 3 ? 0.16 : 0.07);
  }
}

// =====================================================================
// LUKISAN: bilik ICU
// =====================================================================
function drawRoom(t, lv) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#071826'); g.addColorStop(0.65, '#0b2233'); g.addColorStop(1, '#04101a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // tingkap malam dengan bintang & bandar
  const wx = pat.x + pat.w * 0.1, wy = H * 0.06, ww = pat.w * 0.8, wh = H * 0.24;
  ctx.save(); rr(wx, wy, ww, wh, 12 * U); ctx.clip();
  const sk = ctx.createLinearGradient(0, wy, 0, wy + wh); sk.addColorStop(0, '#0a1440'); sk.addColorStop(1, '#2a1f5c'); ctx.fillStyle = sk; ctx.fillRect(wx, wy, ww, wh);
  stars.forEach((s) => { ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t / 900 + s.p)); ctx.fillStyle = '#fff'; circle(wx + s.x * ww, wy + s.y * wh * 1.6, s.r); ctx.fill(); });
  ctx.globalAlpha = 1; ctx.fillStyle = '#fff6c8'; circle(wx + ww * 0.82, wy + wh * 0.28, 16 * U); ctx.fill();
  ctx.fillStyle = '#10163a'; for (let i = 0; i < 9; i++) { const bw = ww / 9, bh = wh * (0.25 + ((i * 37) % 30) / 100); ctx.fillRect(wx + i * bw, wy + wh - bh, bw - 3, bh); }
  ctx.fillStyle = 'rgba(255,220,120,.6)'; for (let i = 0; i < 9; i++) for (let j = 0; j < 4; j++) if ((i * 7 + j * 3) % 5 < 2) ctx.fillRect(wx + i * (ww / 9) + 6, wy + wh - 12 - j * 12, 4, 6);

function readTime() { const m = clamp(parseInt($('mm').value, 10) || 0, 0, 99), s = clamp(parseInt($('ss').value, 10) || 0, 0, 59); return m * 60 + s; }
function renderChips() {
  const el = $('chips'); el.innerHTML = ''; const cur = readTime();
  PRESETS.forEach(([m, s]) => { const b = document.createElement('button'); b.className = 'chip' + (m * 60 + s === cur ? ' on' : ''); b.textContent = m ? `${m} minit` : `${s} saat`; b.onclick = () => { $('mm').value = m; $('ss').value = s; renderChips(); SFX.tick(); }; el.appendChild(b); });
}
let seqTimers = [];
function clearSeq() { seqTimers.forEach(clearTimeout); seqTimers = []; }
function startIntro() {
  ac(); total = readTime(); if (total <= 0) { $('mm').focus(); return; }
  remain = total; lsSet('pj_cfg', { task: $('task').value, t: total });
  state = 'intro'; $('setup').hidden = true; $('end').hidden = true; $('ctrl').hidden = true; flatline(false);
  const task = ($('task').value || '').trim();
  $('introTask').textContent = task ? '📝 ' + task : '';
  $('introTime').textContent = fmt(total);
  $('intro').hidden = false; $('intro').querySelectorAll('div').forEach((d) => { d.style.animation = 'none'; void d.offsetWidth; d.style.animation = ''; });
  SFX.whoosh();
  speak(`Cepat siapkan${task ? ' ' + task : ''} dalam masa ${durWords(total)}!`);
  const base = 3200;
  [3, 2, 1].forEach((n, i) => seqTimers.push(setTimeout(() => { $('intro').hidden = true; showNum(String(n)); SFX.count(); }, base + i * 1000)));
  seqTimers.push(setTimeout(() => { showNum('MULA!', true); SFX.go(); speak('Mula!'); }, base + 3000));
  seqTimers.push(setTimeout(() => { $('num').innerHTML = ''; begin(); }, base + 3800));
}
function showNum(txt, go) { const el = $('num'); el.innerHTML = ''; const s = document.createElement('span'); s.textContent = txt; if (go) s.className = 'go'; el.appendChild(s); }
function begin() { state = 'run'; lastSec = -1; alarmT = 0; $('ctrl').hidden = false; $('pauseBtn').textContent = '⏸ Jeda'; dimCtrl(); }
function goFlat() {
  state = 'flat'; flatT = 0; $('ctrl').hidden = true; flatline(true); SFX.shock();
  setTimeout(() => {
    if (state !== 'flat') return;
    $('endCard').className = 'endcard'; $('endTitle').textContent = 'MASA TAMAT!';
    $('endText').innerHTML = 'Alamak! Pesakit pengsan… 💔<br>Lain kali kita siapkan lebih cepat!';
    $('end').hidden = false;
  }, 2600);
}
function save() {
  if (state !== 'run' && state !== 'paused') return;
  const left = remain; state = 'saved'; $('ctrl').hidden = true; SFX.win(); speak('Syabas! Pesakit selamat!');
  const cols = ['#1de9b6', '#ffd84d', '#ff4d6d', '#5ad8ff', '#b18cff', '#ff9f1c'];
  for (let i = 0; i < 220; i++) particles.push({ x: rand(0, W), y: rand(-H * 0.6, -10), vx: rand(-60, 60), vy: rand(140, 280), life: 1, max: rand(3, 5), r: rand(7, 12), rot: rand(0, 6), vr: rand(-6, 6), col: cols[i % cols.length] });
  $('endCard').className = 'endcard ok'; $('endTitle').textContent = 'PESAKIT SELAMAT! 🎉';
  $('endText').innerHTML = `Syabas, doktor kecil! Tugasan siap dengan baki masa <b>${fmt(left)}</b>.`;
  setTimeout(() => { $('end').hidden = false; }, 900);
}
function togglePause() {
  if (state === 'run') { state = 'paused'; $('pauseBtn').textContent = '▶ Sambung'; }
  else if (state === 'paused') { state = 'run'; $('pauseBtn').textContent = '⏸ Jeda'; }
}
function toSetup() { clearSeq(); flatline(false); try { speechSynthesis.cancel(); } catch (e) {} state = 'setup'; remain = readTime(); total = remain; $('intro').hidden = true; $('num').innerHTML = ''; $('end').hidden = true; $('ctrl').hidden = true; $('setup').hidden = false; renderChips(); }
let dimTimer = null;
function dimCtrl() { const c = $('ctrl'); c.classList.remove('dim'); clearTimeout(dimTimer); dimTimer = setTimeout(() => c.classList.add('dim'), 4000); }
addEventListener('pointermove', () => { if (state === 'run' || state === 'paused') dimCtrl(); });

$('goBtn').onclick = startIntro;
$('mm').oninput = renderChips; $('ss').oninput = renderChips;
$('pauseBtn').onclick = togglePause;
$('addBtn').onclick = () => { if (state === 'run' || state === 'paused') { remain += 30; total = Math.max(total, remain); SFX.tick(); } };
$('saveBtn').onclick = save;
$('resetBtn').onclick = toSetup; $('setBtn').onclick = toSetup;
$('againBtn').onclick = () => { $('end').hidden = true; startIntro(); };
function toggleMute() { muted = !muted; $('muteBtn').textContent = muted ? '🔇' : '🔊'; if (muted) { flatline(false); try { speechSynthesis.cancel(); } catch (e) {} } }
function toggleFS() { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }
$('muteBtn').onclick = toggleMute; $('fsBtn').onclick = toggleFS;
document.addEventListener('keydown', (e) => {
  if (e.target && /input/i.test(e.target.tagName)) { if (e.key === 'Enter' && state === 'setup') startIntro(); return; }
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); togglePause(); }
  else if (k === 's') save();
  else if (k === 'm') toggleMute();
  else if (k === 'f') toggleFS();
});
addEventListener('resize', resize);

const cfg = lsGet('pj_cfg', null);
if (cfg) { if (cfg.task != null) $('task').value = cfg.task; if (cfg.t) { $('mm').value = Math.floor(cfg.t / 60); $('ss').value = cfg.t % 60; } }
resize(); renderChips(); total = remain = readTime();
requestAnimationFrame(frame);
window.__pj = { get state() { return state; }, set remain(v) { remain = v; }, get remain() { return remain; }, startIntro, save, begin };
})();
</script>
</body>
</html>
