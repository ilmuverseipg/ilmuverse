<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk — Ilmuverse</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Fredoka:wght@400;500;600&display=swap">
<style>
  :root {
    --pink: #FF6FA5; --purple: #B18CFF; --blue: #5CC8FF; --ink: #2B2140;
    --card: #FFFFFF; --muted: #6E6487;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Fredoka', sans-serif; color: var(--ink);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    background: #140f2e;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,111,165,.35) 0, transparent 35%),
      radial-gradient(circle at 85% 15%, rgba(92,200,255,.30) 0, transparent 35%),
      radial-gradient(circle at 70% 90%, rgba(177,140,255,.35) 0, transparent 40%);
    overflow-x: hidden;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .stars i {
    position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }

  .card {
    position: relative; width: 100%; max-width: 400px;
    background: var(--card); border-radius: 28px; padding: 0 28px 26px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    text-align: center;
  }
  .card.shake { animation: shake .5s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); } 20% { transform: translateX(-12px); }
    40% { transform: translateX(10px); } 60% { transform: translateX(-7px); } 80% { transform: translateX(4px); }
  }

  /* ===== AVATAR ===== */
  .avatar-wrap { width: 190px; height: 165px; margin: -78px auto 4px; }
  .avatar-wrap.happy { animation: hop .6s ease; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-18px); } }
  #avatar { width: 100%; height: 100%; overflow: visible; }
  #head { transition: transform .25s ease; transform-origin: 100px 110px; }
  .eye { transform-box: fill-box; transform-origin: center; transition: transform .08s; }
  .eye.blink { transform: scaleY(.1); }
  .pupil { transition: transform .12s ease-out; }
  .paw { transition: transform .38s cubic-bezier(.3, 1.4, .5, 1); }
  #mouth { transition: d .2s; }

  h1 { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 28px; margin: 0; letter-spacing: 1px;
       background: linear-gradient(90deg, var(--pink), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--muted); font-size: 15px; margin: 2px 0 18px; }

  .field { position: relative; display: flex; align-items: center; }
  .field input {
    width: 100%; font-family: 'Fredoka', sans-serif; font-size: 18px; color: var(--ink);
    padding: 14px 120px 14px 18px; border-radius: 16px; border: 2.5px solid #E4DCF5; background: #FAF7FF;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus { border-color: var(--purple); box-shadow: 0 0 0 4px rgba(177,140,255,.25); }
  .field input.err { border-color: #FF5C7A; }
  .toggle {
    position: absolute; right: 8px; font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 600;
    border: none; border-radius: 12px; padding: 8px 12px; cursor: pointer;
    background: #EFE8FF; color: #5B3FA8;
  }
  .toggle:hover { background: #E3D7FF; }

  .go {
    width: 100%; margin-top: 14px; border: none; border-radius: 16px; padding: 14px;
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 1px; color: #fff; cursor: pointer;
    background: linear-gradient(90deg, var(--pink), var(--purple)); box-shadow: 0 8px 20px rgba(177,140,255,.45);
    transition: transform .15s, filter .15s;
  }
  .go:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .go:disabled { filter: grayscale(.4); cursor: wait; transform: none; }
  .msg { min-height: 22px; margin-top: 10px; font-size: 15px; font-weight: 500; color: #E2365A; }
  .msg.ok { color: #1E9E64; }

  .contact {
    margin-top: 14px; padding-top: 14px; border-top: 2px dashed #EEE7FA;
    font-size: 14.5px; color: var(--muted); line-height: 1.5;
  }
  .contact b { color: var(--ink); }
  .contact a { color: #5B3FA8; font-weight: 600; text-decoration: none; }
  .contact a:hover { text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { .paw, #head, .pupil { transition: none; } .card.shake, .avatar-wrap.happy { animation: none; } }
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>

<main class="card" id="card">
  <div class="avatar-wrap" id="avatarWrap" aria-hidden="true">
    <svg id="avatar" viewBox="0 0 200 175">
      <defs>
        <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#C9A8FF"/><stop offset="1" stop-color="#FF8DB8"/>
        </linearGradient>
        <linearGradient id="pawFur" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#B48CF5"/><stop offset="1" stop-color="#F07AA8"/>
        </linearGradient>
        <clipPath id="clip"><rect x="-20" y="-20" width="240" height="194"/></clipPath>
      </defs>
      <g clip-path="url(#clip)">
        <g id="head">
          <!-- telinga -->
          <circle cx="48" cy="48" r="22" fill="url(#fur)"/><circle cx="48" cy="48" r="11" fill="#FFD1E3"/>
          <circle cx="152" cy="48" r="22" fill="url(#fur)"/><circle cx="152" cy="48" r="11" fill="#FFD1E3"/>
          <!-- antena bintang -->
          <line x1="100" y1="34" x2="100" y2="14" stroke="#B48CF5" stroke-width="4" stroke-linecap="round"/>
          <path d="M100 2 l3.5 7 7.5 1 -5.5 5 1.5 7.5 -7 -3.8 -7 3.8 1.5 -7.5 -5.5 -5 7.5 -1z" fill="#FFD75C"/>
          <!-- kepala -->
          <ellipse cx="100" cy="102" rx="74" ry="68" fill="url(#fur)"/>
          <ellipse cx="100" cy="116" rx="52" ry="40" fill="#FFF1F7" opacity=".55"/>
          <!-- mata -->
          <g class="eye" id="eyeL">
            <ellipse cx="72" cy="92" rx="15" ry="17" fill="#fff"/>
            <g class="pupil" id="pupilL"><circle cx="72" cy="94" r="8" fill="#2B2140"/><circle cx="75" cy="90" r="2.8" fill="#fff"/></g>
          </g>
          <g class="eye" id="eyeR">
            <ellipse cx="128" cy="92" rx="15" ry="17" fill="#fff"/>
            <g class="pupil" id="pupilR"><circle cx="128" cy="94" r="8" fill="#2B2140"/><circle cx="131" cy="90" r="2.8" fill="#fff"/></g>
          </g>
          <!-- pipi & mulut -->
          <ellipse cx="54" cy="118" rx="11" ry="6.5" fill="#FF6FA5" opacity=".45"/>
          <ellipse cx="146" cy="118" rx="11" ry="6.5" fill="#FF6FA5" opacity=".45"/>
          <path id="mouth" d="M88 122 Q100 134 112 122" fill="none" stroke="#2B2140" stroke-width="4" stroke-linecap="round"/>
        </g>
        <!-- tapak tangan (penutup mata) -->
        <g class="paw" id="pawL" style="transform: translate(0px, 92px)">
          <ellipse cx="72" cy="94" rx="25" ry="21" fill="url(#pawFur)"/>
          <circle cx="60" cy="80" r="5" fill="#FFD1E3"/><circle cx="72" cy="76" r="5" fill="#FFD1E3"/><circle cx="84" cy="80" r="5" fill="#FFD1E3"/>
        </g>
        <g class="paw" id="pawR" style="transform: translate(0px, 92px)">
          <ellipse cx="128" cy="94" rx="25" ry="21" fill="url(#pawFur)"/>
          <circle cx="116" cy="80" r="5" fill="#FFD1E3"/><circle cx="128" cy="76" r="5" fill="#FFD1E3"/><circle cx="140" cy="80" r="5" fill="#FFD1E3"/>
        </g>
      </g>
    </svg>
  </div>

  <h1>ILMUVERSE</h1>
  <p class="sub">Masukkan kata laluan untuk masuk</p>

  <form id="form" autocomplete="on">
    <div class="field">
      <input id="pw" name="password" type="text" autocomplete="current-password" placeholder="Kata laluan"
             autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Kata laluan" required>
      <button type="button" class="toggle" id="toggle" aria-pressed="false">🙈 Sembunyi</button>
    </div>
    <button type="submit" class="go" id="go">MASUK ›</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>

  <div class="contact">
    Untuk mendapatkan akses, sila hubungi <b>Cikgu Din</b><br>
    📞 <a href="tel:+60195660470">019-566 0470</a> &nbsp;·&nbsp; 💬 <a href="https://wa.me/60195660470" target="_blank" rel="noopener">WhatsApp</a>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const pw = $('pw'), toggle = $('toggle'), form = $('form'), msg = $('msg'), go = $('go'), card = $('card');
  const pawL = $('pawL'), pawR = $('pawR'), pupilL = $('pupilL'), pupilR = $('pupilR');
  const eyes = [$('eyeL'), $('eyeR')], head = $('head'), mouth = $('mouth'), wrap = $('avatarWrap');

  // bintang latar
  const st = $('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's'; s.style.opacity = .3;
    st.appendChild(s);
  }

  const MOUTH = {
    smile: 'M88 122 Q100 134 112 122',
    ooh:   'M94 124 Q100 132 106 124 Q100 118 94 124',
    shy:   'M92 125 Q100 129 108 125',
    sad:   'M88 130 Q100 120 112 130',
    happy: 'M84 118 Q100 142 116 118 Z'
  };
  function setMouth(k) {
    mouth.setAttribute('d', MOUTH[k]);
    mouth.setAttribute('fill', k === 'happy' ? '#7A2A4A' : 'none');
  }

  let hidden = false, peekTimer = null, typing = false;
  const REST = 'translate(0px, 92px)', COVER = 'translate(0px, 0px)';
  const PEEK_L = 'translate(-6px, 30px) rotate(-14deg)';

  function setPaws(state) {
    pawL.style.transformOrigin = '72px 94px';
    pawR.style.transformOrigin = '128px 94px';
    if (state === 'rest') { pawL.style.transform = REST; pawR.style.transform = REST; }
    else if (state === 'cover') { pawL.style.transform = COVER; pawR.style.transform = COVER; }
    else if (state === 'peek') { pawL.style.transform = PEEK_L; pawR.style.transform = COVER; }
  }

  // Ukur kedudukan kursor dalam input -> ke mana mata perlu melihat
  const meas = document.createElement('canvas').getContext('2d');
  function caretRatio() {
    const cs = getComputedStyle(pw);
    meas.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const pos = pw.selectionStart == null ? pw.value.length : pw.selectionStart;
    const shown = hidden ? '•'.repeat(pos) : pw.value.slice(0, pos);
    const w = meas.measureText(shown).width;
    const usable = pw.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    return Math.max(0, Math.min(1, w / Math.max(1, usable)));
  }
  function look(dx, dy) {
    const t = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
    pupilL.style.transform = t; pupilR.style.transform = t;
  }
  function lookAtCaret() {
    const r = caretRatio();
    look(-7 + r * 14, 6);
    head.style.transform = `rotate(${(-4 + r * 8).toFixed(1)}deg)`;
  }
  function lookIdle() { look(0, 0); head.style.transform = ''; }

  function refreshFace() {
    if (hidden) {
      if (typing) { setPaws('peek'); setMouth('shy'); lookAtCaret(); }
      else { setPaws('cover'); setMouth('shy'); }
    } else {
      setPaws('rest');
      setMouth(document.activeElement === pw && pw.value ? 'ooh' : 'smile');
      if (document.activeElement === pw) lookAtCaret(); else lookIdle();
    }
  }

  // Mula-mula kata laluan DITUNJUK; tekan butang baru sembunyi
  toggle.addEventListener('click', () => {
    hidden = !hidden;
    pw.type = hidden ? 'password' : 'text';
    toggle.textContent = hidden ? '👁️ Tunjuk' : '🙈 Sembunyi';
    toggle.setAttribute('aria-pressed', String(hidden));
    typing = false; clearTimeout(peekTimer);
    refreshFace(); pw.focus();
  });

  function onType() {
    msg.textContent = ''; msg.className = 'msg'; pw.classList.remove('err');
    typing = true; refreshFace();
    clearTimeout(peekTimer);
    peekTimer = setTimeout(() => { typing = false; refreshFace(); }, 700);
  }
  pw.addEventListener('input', onType);
  pw.addEventListener('keyup', e => { if (e.key.startsWith('Arrow') || e.key === 'Home' || e.key === 'End') onType(); });
  pw.addEventListener('click', () => { if (!hidden) lookAtCaret(); });
  pw.addEventListener('focus', refreshFace);
  pw.addEventListener('blur', () => { typing = false; refreshFace(); });

  // Bila tak menaip, mata ikut tetikus (hanya bila mata terbuka)
  document.addEventListener('mousemove', e => {
    if (hidden || document.activeElement === pw) return;
    const r = $('avatar').getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width / 2)) / window.innerWidth * 14;
    const dy = (e.clientY - (r.top + r.height / 2)) / window.innerHeight * 12;
    look(Math.max(-7, Math.min(7, dx)), Math.max(-6, Math.min(6, dy)));
  });

  // Kelip mata
  (function blink() {
    setTimeout(() => {
      eyes.forEach(e => e.classList.add('blink'));
      setTimeout(() => { eyes.forEach(e => e.classList.remove('blink')); blink(); }, 130);
    }, 2500 + Math.random() * 3000);
  })();

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!pw.value) { pw.focus(); return; }
    go.disabled = true; msg.className = 'msg'; msg.textContent = 'Menyemak…';
    try {
      const next = new URLSearchParams(location.search).get('next') || '/guru.html';
      const r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin', body: JSON.stringify({ password: pw.value, next }) });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.ok) {
        msg.className = 'msg ok'; msg.textContent = 'Berjaya! Selamat datang 🎉';
        setPaws('rest'); setMouth('happy'); lookIdle();
        wrap.classList.remove('happy'); void wrap.offsetWidth; wrap.classList.add('happy');
        setTimeout(() => { location.href = d.next || '/guru.html'; }, 700);
        return;
      }
      msg.textContent = d.mesej || 'Kata laluan salah.';
    } catch (err) {
      msg.textContent = 'Tidak dapat menyambung ke server. Cuba lagi.';
    }
    go.disabled = false; pw.classList.add('err');
    setPaws('rest'); setMouth('sad'); look(0, 5);
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    pw.select();
    setTimeout(() => refreshFace(), 1600);
  });

  refreshFace();
  pw.focus();
})();
</script>
</body>
</html>
