<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Serangan Angkasa: Kuiz Kata Ganda — Ilmuverse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@700;800&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0820; font-family: 'Fredoka', sans-serif; color: #fff; }
  #cv { position: fixed; inset: 0; display: block; cursor: crosshair; touch-action: none; }
  .hud { position: fixed; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 12px 0; pointer-events: none; z-index: 5; }
  .hud[hidden] { display: none; }
  .topbar { display: flex; align-items: center; gap: 14px; width: min(1100px, 100%); justify-content: space-between; }
  .pill { background: rgba(10, 8, 40, .72); border: 2px solid rgba(255,255,255,.18); border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: clamp(14px, 1.8vw, 20px); backdrop-filter: blur(4px); white-space: nowrap; }
  .boss { flex: 1; display: flex; align-items: center; gap: 10px; max-width: 520px; }
  .boss .lbl { font-weight: 700; font-size: clamp(13px, 1.6vw, 18px); color: #ffb3f0; white-space: nowrap; text-shadow: 0 2px 6px #000; }
  .hpbar { flex: 1; height: 18px; border-radius: 999px; background: rgba(0,0,0,.5); border: 2px solid rgba(255,255,255,.3); overflow: hidden; }
  .hpbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff3d7f, #ff9f1c); transition: width .5s cubic-bezier(.2,1.4,.4,1); }
  .qbox { width: min(1100px, 100%); background: linear-gradient(180deg, rgba(36, 16, 92, .92), rgba(20, 10, 60, .92)); border: 3px solid #7b5cff; border-radius: 22px; padding: 12px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 30px rgba(123,92,255,.35); }
  .qnum { font-family: 'Baloo 2'; font-weight: 800; color: #ffd84d; letter-spacing: 2px; font-size: clamp(14px, 1.7vw, 19px); }
  .qtext { font-family: 'Baloo 2'; font-weight: 800; font-size: clamp(22px, 3.4vw, 42px); line-height: 1.15; }
  .qtext b { color: #5ff0ff; }
  .qbox.pop { animation: pop .45s cubic-bezier(.2,1.5,.4,1); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .toast { position: fixed; left: 50%; top: 48%; transform: translate(-50%, -50%); font-family: 'Baloo 2'; font-weight: 800; font-size: clamp(40px, 8vw, 96px); pointer-events: none; z-index: 8; opacity: 0; text-shadow: 0 6px 0 rgba(0,0,0,.35), 0 0 30px currentColor; white-space: nowrap; }
  .toast.show { animation: toast 1.3s ease forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 30% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1); } }
  .hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 9; background: rgba(10,8,40,.8); border: 2px solid rgba(255,216,77,.6); border-radius: 999px; padding: 8px 18px; font-weight: 700; font-size: clamp(13px, 1.7vw, 19px); white-space: nowrap; pointer-events: none; transition: opacity .4s; }
  .hint[hidden] { display: block; opacity: 0; }
  #handCur { position: fixed; left: 0; top: 0; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; z-index: 30; pointer-events: none; display: none; align-items: center; justify-content: center; font-size: 40px; background: rgba(255,255,255,.22); border: 6px solid #5ff0ff; box-shadow: 0 0 0 3px #1a1033, 0 0 22px rgba(95,240,255,.7); transition: background .1s, border-color .1s, transform .1s; }
  #handCur.on { display: flex; }
  #handCur.aim { border-color: #ffd84d; box-shadow: 0 0 0 3px #1a1033, 0 0 26px rgba(255,216,77,.9); }
  #handCur.down { background: rgba(255,216,77,.5); transform: scale(.85); }
  .big.hover { transform: scale(1.08); filter: brightness(1.15); outline: 4px solid #fff; }
  #vid { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; left: 0; top: 0; }
  .ctrl { position: fixed; right: 12px; bottom: 12px; display: flex; gap: 8px; z-index: 9; }
  .ctrl button, .ctrl a { font-family: 'Fredoka'; font-weight: 600; font-size: 15px; color: #fff; background: rgba(10,8,40,.7); border: 2px solid rgba(255,255,255,.25); border-radius: 12px; padding: 8px 12px; cursor: pointer; text-decoration: none; }
  .ctrl button:hover, .ctrl a:hover { background: rgba(60,40,160,.8); }

  /* ===== skrin pembuka & tamat ===== */
  .screen { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; padding: 0 16px 6vh; pointer-events: none; }
  .screen[hidden] { display: none; }
  .bubble { pointer-events: auto; position: relative; width: min(860px, 100%); background: #fffdf5; color: #241552; border-radius: 28px; padding: 22px 28px 20px; box-shadow: 0 16px 40px rgba(0,0,0,.5); border: 4px solid #ffd84d; }
  .bubble::after { content: ''; position: absolute; left: 22%; bottom: -26px; border: 14px solid transparent; border-top: 16px solid #ffd84d; }
  .speaker { font-family: 'Baloo 2'; font-weight: 800; color: #7b5cff; font-size: clamp(16px, 2vw, 22px); letter-spacing: 1px; }
  .say { font-family: 'Baloo 2'; font-weight: 800; font-size: clamp(22px, 3.2vw, 38px); line-height: 1.2; min-height: 2.5em; }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
  .big { font-family: 'Baloo 2'; font-weight: 800; font-size: clamp(18px, 2.4vw, 26px); border: none; cursor: pointer; border-radius: 16px; padding: 10px 26px; color: #fff; background: linear-gradient(135deg, #ff5d8f, #ff9f1c); box-shadow: 0 6px 0 #b3366a; transition: transform .1s; }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #b3366a; }
  .big.alt { background: linear-gradient(135deg, #5ff0ff, #7b5cff); box-shadow: 0 6px 0 #3b2a9c; }
  .title { position: fixed; top: 6vh; left: 0; right: 0; text-align: center; z-index: 10; pointer-events: none; }
  .title h1 { margin: 0; font-family: 'Baloo 2'; font-weight: 800; font-size: clamp(38px, 7vw, 92px); line-height: 1; background: linear-gradient(180deg, #fff6b0, #ffd84d 45%, #ff7a2f); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 rgba(90,20,0,.6)) drop-shadow(0 0 24px rgba(255,160,40,.5)); animation: float 3s ease-in-out infinite; }
  .title p { margin: 6px 0 0; font-weight: 700; font-size: clamp(16px, 2.2vw, 26px); color: #c8bcff; letter-spacing: 3px; }
  .title[hidden] { display: none; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .result { pointer-events: auto; width: min(640px, 100%); background: rgba(20, 10, 60, .94); border: 4px solid #ffd84d; border-radius: 28px; padding: 22px; text-align: center; margin-bottom: 8vh; box-shadow: 0 20px 50px rgba(0,0,0,.6); animation: pop .6s cubic-bezier(.2,1.5,.4,1); }
  .result h2 { margin: 0; font-family: 'Baloo 2'; font-weight: 800; font-size: clamp(34px, 5vw, 58px); color: #ffd84d; }
  .stars { font-size: clamp(40px, 6vw, 64px); letter-spacing: 8px; margin: 4px 0; }
  .stars span { display: inline-block; opacity: .25; transform: scale(.6); transition: all .4s cubic-bezier(.2,1.6,.4,1); }
  .stars span.on { opacity: 1; transform: scale(1); }
  .result p { font-size: clamp(16px, 2vw, 22px); margin: 6px 0 14px; color: #e7e0ff; }
</style>
</head>
<body>
<canvas id="cv" aria-label="Permainan menembak kapal angkasa"></canvas>

<div class="title" id="title"><h1>SERANGAN ANGKASA!</h1><p>KUIZ KATA GANDA · SKUAD CILIK</p></div>

<div class="hud" id="hud" hidden>
  <div class="topbar">
    <span class="pill" id="score">⭐ 0</span>
    <div class="boss"><span class="lbl">👾 Kapten Gloop</span><div class="hpbar"><i id="hp"></i></div></div>
    <span class="pill" id="prog">1 / 10</span>
  </div>
  <div class="qbox" id="qbox"><div class="qnum" id="qnum">SOALAN 1</div><div class="qtext" id="qtext"></div></div>
</div>
<div class="toast" id="toast"></div>

<div class="screen" id="intro">
  <div class="bubble">
    <div class="speaker" id="speaker">🧒 SKUAD CILIK</div>
    <div class="say" id="say"></div>
    <div class="row">
      <button class="big alt" id="skipBtn">Langkau ⏭</button>
      <button class="big" id="startBtn" hidden>🚀 MULA MISI!</button>
    </div>
  </div>
</div>

<div class="screen" id="end" hidden>
  <div class="result">
    <h2>MISI BERJAYA! 🎉</h2>
    <div class="stars" id="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <p id="endText"></p>
    <div class="row" style="justify-content:center">
      <button class="big" id="againBtn">🔄 Main Semula</button>
      <a class="big alt" href="/game-arab.html" style="text-decoration:none">🎮 GameBox</a>
    </div>
  </div>
</div>

<video id="vid" playsinline muted></video>
<div id="handCur">✋</div>
<div class="hint" id="hint" hidden></div>
<div class="ctrl">
  <button id="handBtn" title="Kawalan tapak tangan (H)">✋ Tangan: ON</button>
  <button id="muteBtn" title="Bunyi (M)">🔊</button>
  <button id="fsBtn" title="Skrin penuh (F)">⛶</button>
  <a href="/game-arab.html" title="Kembali ke GameBox">✕</a>
</div>

<script src="/bobo-kit.js"></script>
<script>
(() => {
'use strict';
// =====================================================================
// SOALAN (boleh diubah di sini) - 3 pilihan, "a" = indeks jawapan betul
// =====================================================================
const QUESTIONS = [
  { q: 'Pilih <b>kata ganda penuh</b>.', o: ['budak-budak', 'sayur-mayur', 'lelabah'], a: 0 },
  { q: 'Ibu membeli pelbagai ___ seperti bayam dan kubis.', o: ['sayur-mayur', 'kuih-muih', 'lauk-pauk'], a: 0 },
  { q: 'Kata ganda separa bagi <b>pohon-pohon</b> ialah ___.', o: ['popohon', 'pepohon', 'pohonan'], a: 1 },
  { q: '<b>Murid-murid</b> ialah kata ganda ___.', o: ['berentak', 'separa', 'penuh'], a: 2 },
  { q: 'Yang manakah <b>kata ganda berentak</b>?', o: ['rumah-rumah', 'gunung-ganang', 'jejari'], a: 1 },
  { q: 'Pilih ejaan kata ganda yang <b>betul</b>.', o: ['kanak2', 'kanak kanak', 'kanak-kanak'], a: 2 },
  { q: 'Kata ganda berentak bagi <b>warna</b> ialah ___.', o: ['warna-warni', 'warna-warna', 'wewarna'], a: 0 },
  { q: '<b>Kuih-muih</b> ialah kata ganda ___.', o: ['penuh', 'berentak', 'separa'], a: 1 },
  { q: 'Kata ganda separa bagi <b>jari-jari</b> ialah ___.', o: ['jajari', 'jari-jarian', 'jejari'], a: 2 },
  { q: 'Abang membeli ___ untuk adik di kedai buku.', o: ['buku-buku', 'gunung-ganang', 'sayur-mayur'], a: 0 },
];
const INTRO = [
  { who: '🧒 SKUAD CILIK', t: 'Hai! Kami Skuad Cilik dan kawan-kawan!' },
  { who: '👧 MEI', t: 'Alamak! Kapten Gloop dan makhluk asingnya mahu menyerang bandar kita!' },
  { who: '👦 DANIAL', t: 'Tolong kami kalahkan mereka. Tembak kapal angkasa yang membawa jawapan KATA GANDA yang betul!' },
];

// =====================================================================
// UTILITI
// =====================================================================
const $ = (id) => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, U = 1, DPR = 1;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
const F = (px, w = 700) => `${w} ${Math.max(1, px | 0)}px Fredoka, sans-serif`;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; U = Math.min(W / 1280, H / 760);
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildScenery();
  if (ships.length) layoutShips(false);
}

// =====================================================================
// BUNYI (Web Audio - tiada fail luar)
// =====================================================================
let AC = null, master = null, muted = false, musicTimer = null, musicStep = 0;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .8; const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'sine', v = .2, f2 = null, delay = 0) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05);
}
let noiseBuf = null;
function noise(d, freq = 900, v = .4, delay = 0, type = 'lowpass') {
  const a = ac(); if (!a || muted) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const t = a.currentTime + delay, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, freq / 8), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + .05);
}
const SFX = {
  laser: () => { tone(1500, .18, 'square', .12, 180); tone(900, .14, 'sawtooth', .06, 120); },
  boom: () => { noise(.7, 1800, .7); tone(110, .5, 'sine', .45, 35); },
  bigBoom: () => { noise(1.6, 2400, .9); tone(90, 1.2, 'sine', .55, 25); noise(1.2, 900, .5, .35); },
  correct: () => [659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, 'triangle', .18, null, i * .08)),
  wrong: () => { tone(200, .35, 'sawtooth', .18, 110); noise(.2, 500, .2); },
  shield: () => { tone(320, .3, 'triangle', .15, 640); },
  warp: () => { tone(200, .5, 'sine', .12, 1400); tone(300, .5, 'triangle', .06, 2000, .05); },
  zap: () => tone(700, .25, 'square', .08, 90),
  blip: () => tone(1100, .05, 'triangle', .08),
  win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .3, 'triangle', .2, null, i * .13)),
  talk: () => tone(rand(500, 760), .05, 'square', .035),
};
const BASS = [110, 110, 131, 98, 110, 110, 147, 131], LEAD = [440, 523, 659, 523, 587, 659, 784, 659, 440, 523, 659, 784, 880, 784, 659, 587];
function startMusic() {
  if (musicTimer) return;
  musicTimer = setInterval(() => {
    if (muted) { musicStep++; return; }
    const s = musicStep++;
    if (s % 2 === 0) tone(BASS[(s / 2 | 0) % BASS.length], .28, 'triangle', .09);
    tone(LEAD[s % LEAD.length], .14, 'square', .025);
    if (s % 4 === 2) noise(.05, 6000, .05, 0, 'highpass');
  }, 170);
}
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

// =====================================================================
// LATAR: langit malam, nebula, planet, bintang, bangunan bandar
// =====================================================================
let stars = [], city = [], city2 = [], meteors = [];
function buildScenery() {
  stars = Array.from({ length: Math.round(W * H / 3500) }, () => ({ x: Math.random() * W, y: Math.random() * H * .75, r: Math.random() * 1.6 + .3, p: Math.random() * 6.28, s: rand(.5, 2) }));
  const mk = (n, hMin, hMax) => { const arr = []; let x = -20; while (x < W + 40) { const w = rand(40, 110) * U; arr.push({ x, w, h: rand(hMin, hMax) * U, win: Math.random() }); x += w + rand(2, 10) * U; } return arr; };
  city2 = mk(0, 90, 220); city = mk(0, 60, 160);
}
function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b0626'); g.addColorStop(.45, '#2a0f5c'); g.addColorStop(.8, '#5b1d6e'); g.addColorStop(1, '#ff7a59');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // nebula
  const neb = (x, y, r, c) => { const n = ctx.createRadialGradient(x, y, 0, x, y, r); n.addColorStop(0, c); n.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = n; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); };
  neb(W * .2 + Math.sin(t / 7000) * 30, H * .25, 380 * U, 'rgba(255,60,180,.22)');
  neb(W * .78, H * .18 + Math.cos(t / 9000) * 20, 420 * U, 'rgba(60,140,255,.22)');
  neb(W * .55, H * .45, 300 * U, 'rgba(140,80,255,.18)');
  // bintang
  for (const s of stars) { const a = .35 + .65 * Math.abs(Math.sin(t / 900 * s.s + s.p)); ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  // planet bercincin
  const px = W * .88, py = H * .3, pr = 70 * U;
  const pg = ctx.createRadialGradient(px - pr * .4, py - pr * .4, pr * .1, px, py, pr);
  pg.addColorStop(0, '#ffd1f0'); pg.addColorStop(.6, '#c85cff'); pg.addColorStop(1, '#4b1a8c');
  ctx.save(); ctx.translate(px, py); ctx.rotate(-.35);
  ctx.strokeStyle = 'rgba(255,220,160,.55)'; ctx.lineWidth = 7 * U; ctx.beginPath(); ctx.ellipse(0, 0, pr * 1.8, pr * .45, 0, Math.PI, 2 * Math.PI); ctx.stroke();
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(0, 0, pr, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, pr * 1.8, pr * .45, 0, 0, Math.PI); ctx.stroke();
  ctx.restore();
  // meteor
  if (Math.random() < .006) meteors.push({ x: rand(W * .1, W), y: rand(0, H * .3), vx: -rand(500, 900), vy: rand(200, 360), life: 1 });
  for (const m of meteors) {
    m.x += m.vx * DT; m.y += m.vy * DT; m.life -= DT * 1.4;
    const tg = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * .15, m.y - m.vy * .15);
    tg.addColorStop(0, `rgba(255,255,255,${m.life})`); tg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = tg; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * .15, m.y - m.vy * .15); ctx.stroke();
  }
  meteors = meteors.filter((m) => m.life > 0);
  // bandar (2 lapisan)
  const ground = H - 70 * U;
  const drawCity = (arr, base, col, winCol, par) => {
    for (const b of arr) {
      const x = b.x + Math.sin(t / 6000) * par;
      ctx.fillStyle = col; ctx.fillRect(x, base - b.h, b.w, b.h + 2);
      ctx.fillStyle = winCol;
      for (let wy = base - b.h + 12 * U; wy < base - 10 * U; wy += 20 * U) for (let wx = x + 8 * U; wx < x + b.w - 10 * U; wx += 16 * U) {
        if (((wx * 7 + wy * 3 + b.win * 100) | 0) % 5 < 2) ctx.fillRect(wx, wy, 7 * U, 9 * U);
      }
    }
  };
  drawCity(city2, ground - 10 * U, '#2b1450', 'rgba(255,214,120,.35)', 6);
  drawCity(city, ground, '#180a33', 'rgba(255,230,140,.75)', 12);
  // tanah
  const gg = ctx.createLinearGradient(0, ground, 0, H);
  gg.addColorStop(0, '#3a1d6e'); gg.addColorStop(1, '#120826');
  ctx.fillStyle = gg; ctx.fillRect(0, ground, W, H - ground);
  ctx.fillStyle = 'rgba(95,240,255,.5)'; ctx.fillRect(0, ground, W, 3 * U);
}

// =====================================================================
// WATAK ASLI: Skuad Cilik (3 wira) & Kapten Gloop (makhluk asing)
// =====================================================================
const HEROES = [
  { name: 'Danial', skin: '#f2c49b', hair: '#2b1a10', suit: '#2f80ff', trim: '#5ff0ff', acc: 'helmet' },

let last = performance.now();
function frame(now) {

    bossY = (state === 'intro' ? H * .3 : hudBottom() + 75 * clamp(U * .9, .45, 1.1)) + Math.sin(t / 900) * 10 * U;
    const bx = W * .5 + Math.sin(t / 1600) * Math.min(W * .25, (state === 'intro' ? 60 : 160) * U);
    if (!(state === 'end')) drawGloop(state === 'finale' ? W * .5 : bx, bossY + (state === 'intro' ? 0 : 0), clamp(U * .9, .45, 1.1), t, bossHurt > 0);
  }

  // kapal jawapan
  for (const sh of ships) {
    if (sh.gone) continue;
    const age = (now - sh.born) / 700;
    if (sh.flee) { sh.y -= 900 * DT * U; sh.x += (sh.x < W / 2 ? -1 : 1) * 300 * DT * U; if (sh.y < -150) sh.gone = true; }
    else if (age < 1) { const e = easeOutBack(clamp(age, 0, 1)); sh.x = sh.hx; sh.y = lerp(-140, sh.hy, e); }
    else { sh.x = sh.hx + Math.sin(t / 900 + sh.ph) * 18 * U; sh.y = sh.hy + Math.sin(t / 600 + sh.ph) * 12 * U; }
    if (sh.shield > 0) sh.shield -= DT * 1.2;
    drawMinion(sh, t);
    if (!sh.flee) drawLabel(sh, t);

    ctx.shadowColor = b.col; ctx.shadowBlur = 24; ctx.lineWidth = 14 * U * b.life; ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();

  if (state === 'intro') {
    HEROES.forEach((h, i) => drawHero(h, W * (.25 + i * .14), gy, hs * 1.25, t, Math.sin(t / 500 + i) > .7 ? 1 : 0));
  } else {
    const sp = Math.min(210 * U, W * .3), sp2 = Math.min(330 * U, W * .42);
    drawHero(HEROES[0], W * .5 - sp, gy, hs, t, heroMood);
    drawHero(HEROES[1], W * .5 + sp, gy, hs, t, heroMood);
    drawHero(HEROES[2], W * .5 + sp2, gy, hs * .9, t, heroMood);
    drawCannon(t);
  }

  // partikel
  for (const p of particles) {
    p.life -= DT / p.max;
    if (p.type === 'spark') { p.x += p.vx * DT; p.y += p.vy * DT; p.vy += 300 * DT * U; ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }

    else if (p.type === 'ring') { p.r += 900 * DT * U; ctx.globalAlpha = clamp(p.life, 0, 1); ctx.strokeStyle = '#fff'; ctx.lineWidth = 8 * p.life; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke(); }

    ctx.save(); ctx.translate(pointer.x, pointer.y); ctx.rotate(t / 600);
    ctx.strokeStyle = hov ? '#ffd84d' : 'rgba(255,255,255,.8)'; ctx.lineWidth = 3;

  }
  ctx.restore();
  if (handMode && cur && K.hands.ready) drawCam();
  syncHandCur();
  requestAnimationFrame(frame);
}

function drawLabel(sh, t) {
  const fs = clamp(34 * U, 20, 46);
  ctx.font = F(fs, 700);
  const tw = ctx.measureText(sh.text).width;
  const w = tw + fs * 2.6, h = fs * 1.7, x = sh.x - w / 2, y = sh.y + 34 * sh.s;
  ctx.save();
  ctx.globalAlpha = sh.dead ? .45 : 1;
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#fffdf5'; rr(x, y, w, h, h / 2); ctx.fill(); ctx.shadowBlur = 0;
  ctx.lineWidth = 4; ctx.strokeStyle = sh.col; ctx.stroke();
  ctx.fillStyle = sh.col; ctx.beginPath(); ctx.arc(x + h / 2, y + h / 2, h / 2 - 5, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = F(fs * .9, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(LETTERS[sh.idx], x + h / 2, y + h / 2 + 1);
  ctx.fillStyle = '#241552'; ctx.font = F(fs, 700); ctx.fillText(sh.text, x + h + (w - h) / 2 - fs * .25, y + h / 2 + 1);
  if (sh.dead) { ctx.strokeStyle = '#ff4d6d'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x + 10, y + h / 2); ctx.lineTo(x + w - 10, y + h / 2); ctx.stroke(); }
  ctx.restore();
  sh.box = { x, y, w, h };
}

function drawCannon(t) {
  const c = cannonPos(), s = clamp(U, .5, 1.3);
  const target = state === 'play' && pointer.x > -900 ? Math.atan2(pointer.y - c.y, pointer.x - c.x) : cannonAng;
  cannonAng = lerp(cannonAng, clamp(target, -Math.PI + .25, -.25), .2);
  ctx.save(); ctx.translate(c.x, c.y);
  ctx.save(); ctx.rotate(cannonAng); ctx.scale(s, s);
  const g = ctx.createLinearGradient(0, -16, 0, 16); g.addColorStop(0, '#bfe9ff'); g.addColorStop(1, '#3b6fd1');
  ctx.fillStyle = g; rr(0, -16, 78, 32, 12); ctx.fill();
  ctx.fillStyle = '#5ff0ff'; rr(66, -20, 16, 40, 6); ctx.fill();
  ctx.fillStyle = `rgba(95,240,255,${.4 + .4 * Math.sin(t / 150)})`; ctx.beginPath(); ctx.arc(84, 0, 9, 0, 7); ctx.fill();
  ctx.restore();
  ctx.scale(s, s);
  ctx.fillStyle = '#2b2470'; ctx.beginPath(); ctx.arc(0, 0, 42, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#7b5cff'; ctx.beginPath(); ctx.arc(0, 0, 30, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#ffd84d'; ctx.beginPath(); ctx.arc(0, -10, 8, 0, 7); ctx.fill();
  ctx.restore();
}

function shipAt(x, y, loose) {
  if (loose) { let best = null, bd = 1e9; for (const sh of ships) { if (sh.gone || sh.flee || sh.dead) continue; const d = Math.hypot(x - sh.x, y - (sh.y + 30 * sh.s)); if (d < bd) { bd = d; best = sh; } } if (best && bd < Math.max(130 * best.s, (best.box ? best.box.w * .6 : 0))) return best; return null; }
  for (const sh of ships) {
    if (sh.gone || sh.flee || sh.dead) continue;
    if (Math.hypot(x - sh.x, y - sh.y) < 75 * sh.s) return sh;
    const b = sh.box; if (b && x >= b.x - 6 && x <= b.x + b.w + 6 && y >= b.y - 6 && y <= b.y + b.h + 6) return sh;
  }
  return null;
}

// =====================================================================
// KAWALAN TAPAK TANGAN (kamera + MediaPipe melalui bobo-kit.js)
//   ✋ tapak tangan terbuka = gerak penanda sasaran
//   ✊ genggam = TEMBAK kapal / tekan butang / teruskan dialog
// =====================================================================
function hint(txt, ms) { const el = $('hint'); el.textContent = txt; el.hidden = false; clearTimeout(hintTimer); if (ms) hintTimer = setTimeout(() => { el.hidden = true; }, ms); }
async function startHand() {
  if (!K || handStarting || K.hands.ready) return;
  handStarting = true; hint('📷 Membuka kamera… sila benarkan akses kamera.', 0);
  const ok = await K.startHands($('vid'), 1, () => ({ W, H }));
  handStarting = false;
  if (!ok) { handMode = false; syncHandBtn(); hint('Kamera tidak dapat dibuka. Main guna tetikus / sentuh.', 5000); return; }
  hint('✋ Gerak tapak tangan untuk membidik  ·  ✊ Genggam untuk TEMBAK', 6000);
}
function syncHandBtn() { $('handBtn').textContent = handMode ? '✋ Tangan: ON' : '🖱️ Tangan: OFF'; }
function toggleHand() { if (!K) return; handMode = !handMode; syncHandBtn(); if (handMode) startHand(); else { cur.active = false; hint('Kawalan tetikus / sentuh', 2500); } }
function handTick() {
  if (!handMode || !cur || !K.hands.ready) return;
  const h = K.hands.list[0]; if (h && h.t !== cur.seen) K.feedHand(cur, h);
  K.updateCursor(cur, DT, true);
  if (!cur.active) return;
  pointer.x = cur.x; pointer.y = cur.y;
  if (!cur.justDown) return;
  ac();
  // genggam di atas butang (Langkau, Mula Misi, Main Semula, GameBox)
  const el = document.elementFromPoint(cur.x, cur.y), btn = el && el.closest('button, a');
  if (btn && !btn.closest('.ctrl') && !btn.hidden) { btn.click(); return; }
  if (state === 'intro') { if (!$('startBtn').hidden) $('startBtn').click(); else nextLine(); return; }
  if (state === 'play') { const sh = shipAt(cur.x, cur.y, true); if (sh) fireAt(sh); else SFX.blip(); }
}
let hovBtn = null;
function syncHandCur() {
  const el = $('handCur'), on = !!(handMode && cur && K && K.hands.ready && cur.active);
  el.classList.toggle('on', on);
  let b = null;
  if (on) {
    el.style.transform = ''; el.style.left = cur.x + 'px'; el.style.top = cur.y + 'px';
    el.textContent = cur.down ? '✊' : '✋'; el.classList.toggle('down', !!cur.down);
    el.classList.toggle('aim', state === 'play' && !!shipAt(cur.x, cur.y, true));
    const t = document.elementFromPoint(cur.x, cur.y); b = t && t.closest('.big');
  }
  if (b !== hovBtn) { if (hovBtn) hovBtn.classList.remove('hover'); if (b) b.classList.add('hover'); hovBtn = b; }
}
function drawCam() {
  const v = K.hands.video; if (!v || !v.videoWidth) return;
  const pw = clamp(170 * U, 110, 200), ph = pw * v.videoHeight / v.videoWidth, px = 14, py = H - ph - 14;
  ctx.save(); rr(px, py, pw, ph, 12); ctx.clip(); ctx.translate(px + pw, py); ctx.scale(-1, 1); ctx.globalAlpha = .85; ctx.drawImage(v, 0, 0, pw, ph); ctx.restore();
  ctx.save(); rr(px, py, pw, ph, 12); ctx.lineWidth = 4; ctx.strokeStyle = cur.active ? (cur.down ? '#ffd84d' : '#22c55e') : 'rgba(255,255,255,.6)'; ctx.stroke();
  ctx.font = F(13, 700); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(cur.active ? (cur.down ? '✊ TEMBAK!' : '✋ Bidik') : 'Tunjuk tapak tangan', px + 8, py + 6); ctx.restore();
}

// =====================================================================
// INPUT
// =====================================================================
cv.addEventListener('pointermove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
cv.addEventListener('pointerdown', (e) => {
  ac(); pointer.x = e.clientX; pointer.y = e.clientY;
  if (state === 'intro') { nextLine(); return; }
  const sh = shipAt(e.clientX, e.clientY); if (sh) fireAt(sh);
});
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'm') return toggleMute();
  if (k === 'f') return toggleFS();
  if (k === 'h') return toggleHand();
  if (state === 'intro' && (k === ' ' || k === 'enter')) { e.preventDefault(); if (!$('startBtn').hidden) $('startBtn').click(); else nextLine(); return; }
  if (state === 'play') { const i = ['1', '2', '3'].indexOf(k) >= 0 ? ['1', '2', '3'].indexOf(k) : ['a', 'b', 'c'].indexOf(k); if (i >= 0 && ships[i]) fireAt(ships[i]); }
});
$('skipBtn').addEventListener('click', () => { ac(); clearInterval(typing); typing = null; introIdx = INTRO.length - 1; showLine(introIdx); });
$('startBtn').addEventListener('click', () => { ac(); try { speechSynthesis.cancel(); } catch (e) {} resetGame(); });
$('againBtn').addEventListener('click', () => { ac(); resetGame(); });
function toggleMute() { muted = !muted; $('muteBtn').textContent = muted ? '🔇' : '🔊'; if (muted) try { speechSynthesis.cancel(); } catch (e) {} }
function toggleFS() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
$('muteBtn').addEventListener('click', toggleMute);
$('handBtn').addEventListener('click', toggleHand);
$('fsBtn').addEventListener('click', toggleFS);
addEventListener('resize', resize);

resize();
showLine(0);
requestAnimationFrame(frame);
if (!K) { handMode = false; $('handBtn').hidden = true; } else startHand();
window.__game = { get state() { return state; }, get qi() { return qi; }, get ships() { return ships; }, get score() { return score; } };
})();
</script>
