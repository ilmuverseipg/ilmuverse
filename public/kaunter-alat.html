<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#e3242b" />
<title>Alat Kawalan Kaunter Lapar 📱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<!--
  ILMUVERSE GAMEBOX - ALAT KAWALAN TELEFON untuk KAUNTER LAPAR
  Buka di telefon guru (imbas QR di skrin laptop). Setiap butang yang ditekan
  dihantar melalui WebSocket /kaunter (routes/kaunterRelay.js) ke skrin laptop
  dalam bilik (kod) yang sama, dan keadaan skrin dipaparkan semula di sini.
-->
<style>
  :root{ --red:#e3242b; --red-dd:#7d0b10; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; min-height:100%; background:#fff1e4; font-family:'Fredoka',system-ui,sans-serif; color:#3a1416; }
  body{ padding:12px 12px calc(12px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; min-height:100vh; user-select:none; }
  header{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  header h1{ margin:0; font-size:20px; color:var(--red); }
  .stat{ font-weight:600; font-size:13px; padding:5px 10px; border-radius:999px; background:#fff; box-shadow:0 3px 0 rgba(0,0,0,.12); white-space:nowrap; }
  .card{ background:#fff; border-radius:22px; padding:12px; box-shadow:0 5px 0 rgba(125,11,16,.18); }
  #timer{ display:flex; align-items:center; justify-content:center; gap:14px; }
  #tNum{ font-size:64px; font-weight:700; color:var(--red-dd); line-height:1; min-width:110px; text-align:center; }
  #tLbl{ font-weight:600; color:#7a3a3e; font-size:15px; }
  .bar{ height:10px; border-radius:99px; background:#f3dcdd; overflow:hidden; margin-top:8px; }
  .bar i{ display:block; height:100%; width:100%; background:#22b573; transition:width .3s linear, background .3s; }
  .ctrl{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button{ font-family:inherit; border:none; cursor:pointer; }
  .big{ font-weight:700; font-size:22px; border-radius:18px; padding:16px 10px; color:#fff; background:var(--red); box-shadow:0 6px 0 var(--red-dd); }
  .big:active, .g:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.25); }
  .big.green{ background:#22b573; box-shadow:0 6px 0 #127a4b; grid-column:1 / -1; font-size:28px; }
  .big.alt{ background:#fff; color:var(--red); border:3px solid var(--red); box-shadow:0 6px 0 #e7c3c5; }
  .big[disabled]{ opacity:.35; }
  .time{ display:flex; align-items:center; justify-content:center; gap:8px; font-weight:600; color:#7a3a3e; grid-column:1 / -1; }
  .time button{ width:44px; height:44px; border-radius:12px; background:#fff; border:3px solid #f1c9cb; font-size:22px; font-weight:700; color:var(--red); }
  .time b{ font-size:26px; min-width:70px; text-align:center; color:#3a1416; }
  #groups{ display:grid; grid-template-columns:1fr 1fr; gap:10px; flex:1; }
  .g{ position:relative; border-radius:20px; padding:14px 8px; color:#fff; background:var(--c); box-shadow:0 6px 0 rgba(0,0,0,.28); text-align:center; min-height:96px; display:flex; flex-direction:column; align-items:center; justify-content:center; transition: filter .2s; }
  .g .n{ font-weight:700; font-size:21px; line-height:1.1; }
  .g .s{ font-weight:600; font-size:14px; margin-top:4px; opacity:.95; }
  .g .k{ position:absolute; left:10px; top:6px; font-size:12px; font-weight:700; opacity:.8; }
  .g .lb{ width:80%; height:7px; border-radius:99px; background:rgba(255,255,255,.35); margin-top:6px; overflow:hidden; }
  .g .lb i{ display:block; height:100%; background:#fff; }
  .g.done{ filter:saturate(.55) brightness(1.15); }
  .g.done::after{ content:'✓'; position:absolute; right:10px; top:4px; font-size:22px; font-weight:700; }
  .g.dead{ filter:grayscale(1) brightness(.85); }
  #join{ display:none; text-align:center; }
  #join input{ font-family:inherit; font-size:42px; font-weight:700; width:200px; text-align:center; letter-spacing:10px; border-radius:16px; border:3px solid #f1c9cb; padding:8px; }
  .hint{ text-align:center; font-size:13px; color:#7a3a3e; }
  #flash{ position:fixed; inset:0; pointer-events:none; background:#fff; opacity:0; transition:opacity .25s; }
</style>
</head>
<body>
<header>
  <h1>📱 Kaunter Lapar</h1>
  <span class="stat" id="stat">Menyambung…</span>
</header>

<div id="join" class="card">
  <p style="font-weight:600;margin:4px 0 10px">Masukkan kod bilik yang tertera di skrin laptop:</p>
  <input id="codeIn" inputmode="numeric" maxlength="6" placeholder="0000">
  <div style="margin-top:12px"><button class="big" id="btnJoin" style="width:200px">Sambung</button></div>
</div>

<div id="main">
  <div class="card">
    <div id="timer"><div id="tNum">--</div><div id="tLbl">Sedia</div></div>
    <div class="bar"><i id="tBar"></i></div>
  </div>
  <div class="ctrl" style="margin-top:12px">
    <div class="time">⏱ Masa: <button id="tMinus">−</button><b id="tVal">30s</b><button id="tPlus">+</button></div>
    <button class="big green" id="bMula">▶ MULA</button>
    <button class="big alt" id="bJeda">⏸ JEDA</button>
    <button class="big alt" id="bMenu">🏠 MENU</button>
  </div>
  <p class="hint" style="margin:12px 0 6px">Tekan nama kumpulan bila kumpulan itu SIAP. Tekan lagi untuk batal.</p>
  <div id="groups"></div>
</div>
<div id="flash"></div>

<script>
(() => {
'use strict';
const COLORS = ['#e3242b', '#f5841f', '#d6409f', '#2fa84f', '#2f7fe0', '#8a4fd8'];
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
let kod = (qs.get('bilik') || '').replace(/\D/g, '');
let ws = null, retry = 0, paparan = 0, st = null;
let masa = parseInt(localStorage.getItem('kl_alat_masa') || '30', 10) || 30;

// butang kumpulan
const gEls = [];
for (let i = 0; i < 6; i++) {
  const b = document.createElement('button'); b.className = 'g'; b.style.setProperty('--c', COLORS[i]);
  b.innerHTML = `<span class="k">${i + 1}</span><div class="n">Kumpulan ${i + 1}</div><div class="s">—</div><div class="lb"><i style="width:100%"></i></div>`;
  b.onclick = () => { send('kumpulan', i); };
  $('groups').appendChild(b); gEls.push(b);
}
function buzz(ms = 25) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} const f = $('flash'); f.style.opacity = 0.35; setTimeout(() => (f.style.opacity = 0), 90); }
function send(a, i = 0) {
  if (!ws || ws.readyState !== 1) { $('stat').textContent = '🔴 Tiada sambungan'; return; }
  ws.send(JSON.stringify({ jenis: 'arahan', a, i, masa })); buzz();
}
$('bMula').onclick = () => send('mula');
$('bJeda').onclick = () => send('jeda');
$('bMenu').onclick = () => { if (confirm('Kembali ke menu di skrin?')) send('menu'); };
function setMasa(v) { masa = Math.max(5, Math.min(600, v)); localStorage.setItem('kl_alat_masa', masa); $('tVal').textContent = masa + 's'; }
$('tMinus').onclick = () => setMasa(masa - (masa > 60 ? 15 : 5));
$('tPlus').onclick = () => setMasa(masa + (masa >= 60 ? 15 : 5));
setMasa(masa);

function render() {
  const on = ws && ws.readyState === 1;
  $('stat').textContent = !on ? '🔴 Menyambung…' : paparan ? `🟢 Skrin bersambung • Kod ${kod}` : `🟡 Skrin belum dibuka • Kod ${kod}`;
  if (!st) return;
  const lbl = { menu: 'Sedia', countdown: 'Bersedia…', running: 'Masa berjalan', paused: 'Dijeda', ended: 'Masa tamat' }[st.st] || '';
  $('tNum').textContent = st.st === 'menu' ? masa : st.rem; $('tLbl').textContent = lbl;
  const frac = st.st === 'menu' ? 1 : Math.max(0, st.rem / (st.total || 1));
  $('tBar').style.width = (frac * 100) + '%'; $('tBar').style.background = frac > 0.5 ? '#22b573' : frac > 0.25 ? '#f5a524' : '#e3242b';
  $('bMula').disabled = !(st.st === 'menu' || st.st === 'ended'); $('bMula').textContent = st.st === 'ended' ? '▶ MULA LAGI' : '▶ MULA';
  $('bJeda').disabled = !(st.st === 'running' || st.st === 'paused'); $('bJeda').textContent = st.st === 'paused' ? '▶ SAMBUNG' : '⏸ JEDA';
  (st.g || []).forEach(([name, done, dead, life], i) => {
    const b = gEls[i]; if (!b) return;
    b.querySelector('.n').textContent = name;
    b.querySelector('.s').textContent = done ? '🥰 KENYANG' : dead ? '😵 PENGSAN' : st.st === 'running' || st.st === 'paused' ? `Lapar ${life}%` : 'Tekan bila siap';
    b.querySelector('.lb i').style.width = (done ? 100 : life) + '%';
    b.classList.toggle('done', !!done); b.classList.toggle('dead', !!dead);
  });
}
function connect() {
  if (!kod || kod.length < 4) { $('join').style.display = 'block'; $('main').style.display = 'none'; $('stat').textContent = 'Masukkan kod'; return; }
  $('join').style.display = 'none'; $('main').style.display = 'block';
  try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/kaunter?bilik=${kod}&peranan=alat`); } catch (e) { return; }
  const me = ws;
  ws.onopen = () => { retry = 0; render(); };
  ws.onmessage = (e) => { let d; try { d = JSON.parse(e.data); } catch (er) { return; } if (d.jenis === 'keadaan') { st = d.data; render(); } else if (d.jenis === 'bilangan') { paparan = d.paparan; render(); } };
  ws.onclose = () => { if (ws === me) { ws = null; paparan = 0; render(); setTimeout(connect, Math.min(8000, 800 * ++retry)); } };
}
$('btnJoin').onclick = () => { kod = $('codeIn').value.replace(/\D/g, ''); if (kod.length >= 4) { history.replaceState(null, '', '?bilik=' + kod); connect(); } };
$('codeIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnJoin').click(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && (!ws || ws.readyState > 1)) connect(); });
connect();
})();
</script>
</body>
</html>
